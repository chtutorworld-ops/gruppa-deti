<title>作业 — Домашнее задание 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
@font-face{font-family:'LXGW WenKai GB';src:url(data:font/woff;base64,__FONT_GB__) format('woff');font-display:block}
:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}

.main{padding:22px 20px}@media(max-width:600px){.main{padding:18px 14px}}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:14px;background:#FFF1D6;color:#7A5200;font-weight:800;font-size:14px;text-align:center}

.list{display:grid;gap:12px;margin-top:16px}

.prog{margin-top:14px;font-size:13px;font-weight:800;color:var(--mu)}.prog .bar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.btn.g{background:var(--bg);color:var(--ac2)}.btn.red{background:var(--no)}.btn.okb{background:var(--ok)}.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.nextbar{display:flex;gap:12px;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid #D6DBE6;flex-wrap:wrap}.nextbar .btn{flex:1 1 auto}.nextbar .nx{flex:2 1 240px}
.cards{display:grid;gap:12px;margin-top:12px}@media(min-width:640px){.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}}
.card{padding:14px 16px;border-radius:20px;font-size:15.5px;line-height:1.5}.card b.h{display:block;font-size:17px;color:var(--ac2);margin-bottom:4px}
.tip{margin-top:14px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15px;line-height:1.45}
.ig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}

.pairs{display:grid;gap:10px;margin-top:12px}

.pair button{padding:12px 6px;border-radius:18px;font:900 30px Nunito;color:var(--ac2)}.pair button.air{color:#D9366A}

.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}.dots i{width:20px;height:6px;border-radius:3px;background:#D6DBE6}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--ac)}
.play{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:14px auto 6px;font-size:38px;color:var(--ac)}
.play.on{color:var(--ok);box-shadow:inset 6px 6px 12px var(--sh1),inset -6px -6px 12px var(--sh2)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.opt{padding:16px 8px;border-radius:18px;font:900 28px Nunito;color:var(--ac2);box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt small{display:block;font:700 13px Manrope;color:var(--mu);margin-top:2px}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD;color:#14855E}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0;color:#B0284F}
.fb{margin-top:12px;font-size:16px;font-weight:700;line-height:1.45;min-height:24px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
.res{font:900 46px Nunito;color:var(--ac2);margin-top:8px}
.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.ans span{padding:8px 4px;border-radius:12px;font:800 17px Nunito;text-align:center}
.ans .ok{background:#DDF5EC;color:#14855E}.ans .no{background:#FFE3EB;color:#B0284F}@media(max-width:480px){.ans{grid-template-columns:repeat(4,1fr)}}
.rc{padding:16px 18px;border-radius:22px;margin-top:12px}
.rc .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.rc .hd .py{font-size:24px;color:var(--ac2)}
.rc .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--mu)}.rc .st.ok{color:var(--ok)}
.rc .row{margin-top:10px;gap:8px}.rc .btn{padding:11px 14px;font-size:15px;border-radius:15px}
.mic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:44px;margin:14px auto 4px}
.mic.rec{background:var(--no);color:#fff;box-shadow:0 0 0 10px rgba(255,92,138,.18),0 0 0 22px rgba(255,92,138,.08);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,92,138,.22),0 0 0 28px rgba(255,92,138,.06)}}
.chart{width:100%;max-width:520px;height:auto;display:block;margin:12px auto 0;border-radius:18px}
.legend{display:flex;justify-content:center;gap:18px;font-size:13.5px;font-weight:700;color:var(--mu);margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.chip{padding:8px 14px;border-radius:14px;font:900 20px Nunito}.chip.on{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
.big{font-size:56px;line-height:1.1}
.fact{padding:22px 20px;margin-top:12px;text-align:center}.fact .lead{text-align:left}.fact .row{justify-content:center}
.sky{position:relative;height:min(64vh,540px);border-radius:24px;overflow:hidden;margin-top:12px;touch-action:manipulation;background:linear-gradient(180deg,#0E1033 0%,#232766 55%,#3B2F7A 100%);transition:box-shadow .2s}
.sky.hit{box-shadow:inset 0 0 0 4px #FF5C8A,inset 0 0 60px rgba(255,92,138,.6)}
.sky .st1,.sky .st2,.sky .st3{position:absolute;inset:-100% 0 0 0;background-repeat:repeat}
.st1{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(1px 1px at 200px 160px,#fff,transparent);background-size:240px 200px;animation:sc 30s linear infinite;opacity:.6}
.st2{background-image:radial-gradient(1.5px 1.5px at 60px 50px,#fff,transparent),radial-gradient(1.5px 1.5px at 170px 140px,#BFD0FF,transparent);background-size:260px 220px;animation:sc 18s linear infinite;opacity:.8}
.st3{background-image:radial-gradient(2.5px 2.5px at 90px 100px,#FFE9A8,transparent),radial-gradient(2px 2px at 230px 30px,#fff,transparent);background-size:300px 260px;animation:sc 10s linear infinite}
@keyframes sc{to{transform:translateY(50%)}}
.planet{position:absolute;right:-60px;top:40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF9FBD,#B0418A 60%,#5A1D57);opacity:.55;box-shadow:0 0 60px rgba(255,120,180,.35)}
.planet::after{content:'';position:absolute;left:-40px;top:78px;width:260px;height:26px;border-radius:50%;border:4px solid rgba(255,220,240,.45);transform:rotate(-14deg)}
.hudin{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;color:#fff;font:800 16px Manrope;z-index:3;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.ship{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);transform-origin:50% 70%;transition:transform .18s ease-out;z-index:2;filter:drop-shadow(0 0 12px rgba(124,111,255,.8))}
.ship .flame{animation:fl .12s infinite alternate;transform-origin:40px 92px}.ship .flame2{animation:fl .09s infinite alternate;transform-origin:40px 92px}
@keyframes fl{to{transform:scaleY(.6)}}
.ast{position:absolute;width:92px;height:92px;margin-left:-46px;border:0;background:none;cursor:pointer;z-index:2;padding:0}
.ast .rk{position:absolute;inset:0;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ast b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 22px Nunito;color:#fff;background:rgba(14,16,51,.72);padding:3px 10px;border-radius:12px;box-shadow:0 0 0 2px rgba(255,255,255,.25);white-space:nowrap}
.ast.boom{animation:boom .45s forwards}@keyframes boom{to{transform:scale(1.7);opacity:0;filter:brightness(2.5)}}
.ast.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.laser{position:absolute;width:6px;background:linear-gradient(#FFF5B0,#FF5C8A);border-radius:3px;transform-origin:50% 100%;box-shadow:0 0 12px #FF8FB0;animation:las .28s forwards;z-index:1}@keyframes las{to{opacity:0}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#FFD36B;box-shadow:0 0 8px #FFB547;animation:spk .6s ease-out forwards;z-index:3}@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.plus{position:absolute;transform:translate(-50%,-50%);font:900 26px Nunito;color:#FFE27A;animation:up .8s forwards;z-index:3;text-shadow:0 2px 6px rgba(0,0,0,.5)}@keyframes up{to{transform:translate(-50%,-140%);opacity:0}}
.cover{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;background:rgba(14,16,51,.55);z-index:4}
.sec{padding:18px 18px 14px;margin-top:14px;font-size:15.5px;line-height:1.5}.sec p{margin-top:8px}.sh{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--ink)}
.se{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.chk{margin-top:10px;padding:10px 12px;border-radius:14px;background:#F4F6FB;font-weight:700;font-size:14.5px}.chk span{display:inline-block;margin:3px 4px;padding:3px 10px;border-radius:10px;background:#E4E8FF;color:var(--ac2);font-weight:800}
.chk span.ok{background:#DDF5EC;color:#14855E}.chk span.no{background:#FFE3EB;color:#B0284F}
.sec .row{margin-top:10px;gap:8px}.sec .row .btn{padding:9px 14px;font-size:15px}
.grp{font:800 13px Manrope;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 2px}
.mouth{position:relative;max-width:420px;margin:10px auto 0;padding:10px;border-radius:24px}.mouth img{width:100%;display:block;border-radius:16px}
.mk{position:absolute;transform:translate(-50%,-50%);color:#fff;font:800 13.5px Manrope;padding:5px 11px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sum{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-top:10px}.sum .big2{font:900 44px Nunito;color:var(--ac2);white-space:nowrap}.sum small{display:block;margin-top:4px;font-weight:700;color:var(--mu)}
.rlist{display:grid;gap:10px;margin-top:14px}.rr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;text-align:left}
.rr .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px}.rr b{color:var(--ink);font-size:15px}.rr small{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-top:2px;line-height:1.35}
.rs{font:900 16px Nunito;padding:6px 10px;border-radius:12px;white-space:nowrap}.rs.l3{background:#DDF5EC;color:#14855E}.rs.l2{background:#E4E8FF;color:#2B3270}.rs.l1{background:#FFF1D6;color:#9A6400}.rs.l0{background:#EEF0F5;color:#A7AFC3}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:460px;margin:8vh auto 0;padding:28px 24px;text-align:center}
.login input{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:0;outline:none;margin-top:18px;color:var(--ink)}
/* ---- ДЗ 3: tone pairs, dialogue, AI trainer ---- */
.wg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}@media(min-width:640px){.wg{grid-template-columns:repeat(3,1fr)}}
.wc{padding:12px 10px;border-radius:18px;text-align:center;display:grid;gap:2px;justify-items:center}
.wc .py{font-size:23px;color:var(--ac2)}.wc .sd{font-size:13px;font-weight:700;color:var(--mu)}.wc .sd b{font-family:Nunito;font-weight:900}.wc .ru{font-size:13.5px;font-weight:700;color:var(--t)}
.wc.on{box-shadow:inset 4px 4px 9px var(--sh1),inset -4px -4px 9px var(--sh2)}
.tcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.tcmp .card{text-align:center}.tcmp svg{max-width:100%;height:auto}
.tl{font:900 30px Nunito}.tl i{font-style:normal;color:var(--mu);margin:0 6px;font-size:24px}
.stage{position:relative;margin-top:14px;padding:16px 12px;border-radius:26px}
.cast{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.who{display:grid;justify-items:center;gap:4px;width:42%;max-width:180px}.who img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:26px;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2);transition:transform .25s}
.who b{font:900 20px Nunito;color:var(--ink)}.who small{font-size:12.5px;font-weight:700;color:var(--mu)}
.who.talk img{box-shadow:0 0 0 4px var(--ac),6px 6px 14px var(--sh1);animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px) rotate(-1.5deg)}}
.vs{font:900 15px Nunito;color:var(--mu);align-self:center;text-align:center}
.chat{display:grid;gap:10px;margin-top:14px}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;text-align:left;display:grid;gap:2px;position:relative}
.bub.l{justify-self:start;border-bottom-left-radius:6px;background:#E6F7F0}.bub.r{justify-self:end;border-bottom-right-radius:6px;background:#FFF1D6;text-align:right}

.cnt{font:900 40px Nunito;color:var(--ac)}
.pairc{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}

.opt.wide{font:800 17px Manrope;padding:14px 12px}

.radq{font-size:96px;line-height:1.1;margin:12px 0 4px}.radq.zh{color:var(--ac2)}
.opt.zh{font-family:var(--han);font-weight:400;font-size:40px}.opt.em{font-size:40px}

.wbox{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:14px auto 0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;touch-action:none}

const ac=acx;

 let a=G[0],b=G[G.length-1];let e=b;while(e+1<f.length&&f[e+1]<0)e++;           // creaky tail after the last pitched frame

 {const n=st2.length;for(let i=Math.floor(n*0.7);i<n;i++)if(Math.abs(st2[i]-st2[i-1])>3.5){st2=st2.slice(0,i);break;}  // sudden jump near the end = measuring glitch

/* ===================== AI trainer: the melody of a pair of syllables ===================== */
// split a recording into two syllables (a voiceless initial b p d t g k f h makes a short silence between them),
// and draw each syllable's melody in semitones against the speaker's own middle voice
function pairTrack(pcm){const sr=16000,hop=160,W=512,F=W+Math.floor(sr/65)+2,f=[],rms=[];let mx=0;
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<W;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/W);rms.push(r);if(r>mx)mx=r;}
 if(!mx)return null;const thr=Math.max(0.01,mx*0.10);
 for(let i=0,k=0;i+F<pcm.length;i+=hop,k++){if(rms[k]<thr){f.push(0);continue;}const [v,ap]=yin(pcm.subarray(i,i+F),sr);f.push(v>65&&v<550&&ap<0.25?v:-1);}
 for(let pass=0;pass<2;pass++){const g=f.slice();for(let i=0;i<g.length;i++){if(g[i]<=0)continue;const nb=[];for(let d=1;d<=5&&nb.length<6;d++){if(g[i-d]>0)nb.push(g[i-d]);if(g[i+d]>0)nb.push(g[i+d]);}
  if(!nb.length){f[i]=-1;continue;}nb.sort((p,q)=>p-q);const m=nb[nb.length>>1];if(Math.abs(12*Math.log2(g[i]/m))>5)f[i]=-1;}}
 // groups of pitched frames; a gap splits them only when it holds a quiet stretch (the consonant) or is long
 const runs=[];let cur=null;f.forEach((x,i)=>{if(x>0){if(cur&&i-cur.e>1){const gap=rms.slice(cur.e+1,i);const quiet=gap.filter(r=>r<mx*0.12).length;if(quiet>=2||i-cur.e>25){runs.push(cur);cur=null;}}if(!cur)cur={s:i,e:i};cur.e=i;}});if(cur)runs.push(cur);
 let segs=runs.filter(r=>f.slice(r.s,r.e+1).filter(x=>x>0).length>=5);
 if(segs.length>=2){segs=segs.sort((a,b)=>(b.e-b.s)-(a.e-a.s)).slice(0,2).sort((a,b)=>a.s-b.s);}
 else if(segs.length===1&&segs[0].e-segs[0].s>=16){const r=segs[0],a=r.s+Math.floor((r.e-r.s)*.3),b=r.s+Math.ceil((r.e-r.s)*.7);let mi=a;for(let i=a;i<=b;i++)if(rms[i]<rms[mi])mi=i;segs=[{s:r.s,e:mi-1},{s:mi+1,e:r.e}];}
 else return null;
 const all=[];segs.forEach(r=>{for(let i=r.s;i<=r.e;i++)if(f[i]>0)all.push(f[i]);});all.sort((a,b)=>a-b);const med=all[all.length>>1];
 const shape=r=>{let v=[];for(let i=r.s;i<=r.e;i++)v.push(f[i]>0?12*Math.log2(f[i]/med):null);
  // fill unpitched frames inside a syllable (creak at the bottom of a 3rd tone) from the neighbours
  for(let i=0;i<v.length;i++)if(v[i]==null){let l=i-1;while(l>=0&&v[l]==null)l--;let r2=i+1;while(r2<v.length&&v[r2]==null)r2++;v[i]=l<0?v[r2]:r2>=v.length?v[l]:Math.min(v[l],v[r2])-1;}
  v=v.map((x,i,a)=>{const w=a.slice(Math.max(0,i-2),i+3).sort((p,q)=>p-q);return w[w.length>>1];});
  const cut=Math.floor(v.length*.1);v=v.slice(cut,v.length-cut);if(v.length<3)return null;
  const N=20,o=[];for(let i=0;i<N;i++){const p=i*(v.length-1)/(N-1),a=Math.floor(p),b=Math.min(v.length-1,a+1);o.push(v[a]+(v[b]-v[a])*(p-a));}return o;};
 const A=shape(segs[0]),B=shape(segs[1]);if(!A||!B)return null;return {a:A,b:B,hz:med};}
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
const feat=x=>{const st=avg(x.slice(0,3)),en=avg(x.slice(-3)),mn=Math.min(...x),mxv=Math.max(...x);return {st,en,mn,mx:mxv,mean:avg(x),rise:en-mn,dip:st-mn,fall:st-en};};
// lenient on purpose: children get the idea first, precision comes later
function judgePair(r,type){const a=feat(r.a),b=feat(r.b);
 if(type==='33'){
  if(a.rise<1.2)return {ok:false,why:'a-flat',msg:'Первый слог не поднялся. Начни пониже и веди голос <b>вверх</b>, как удивлённое «а?»'};
  if(a.dip>=2.2)return {ok:false,why:'a-full3',msg:'Первый слог прозвучал «галочкой», как полный 3-й тон. В 3 + 3 первый слог просто идёт <b>снизу вверх</b>, как 2-й тон.'};
  if(b.mn>a.en-1.5)return {ok:false,why:'b-high',msg:'Второй слог — 3-й тон: опусти голос <b>низко-низко</b>, ниже, чем закончился первый слог.'};
  return {ok:true};}

 if(a.mean>b.st-1.5)return {ok:false,why:'a-high',msg:'Первый слог должен быть <b>низким</b>, ниже начала второго. Опусти голос пониже.'};
 if(b.fall<2.5)return {ok:false,why:'b-flat',msg:'Второй слог — 4-й тон: <b>резко сверху вниз</b>, как строгое «Нет!»'};

const TPL={'33':{a:Array.from({length:20},(_,i)=>-1+3.5*Math.pow(i/19,1.3)),b:Array.from({length:20},(_,i)=>{const x=i/19;return x<.6?0.5-4.5*x/.6:-4+2*(x-.6)/.4;})},

/* ===================== my mini-dialogue in pinyin ===================== */
const TM={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};
// ni3 → nǐ, lv4 → lǜ; marks the vowel the way dictionaries do
function tone1(b,t){if(!t||t>4)return b;let k=b.search(/[ae]/);if(k<0)k=b.indexOf('ou');if(k<0){for(let j=b.length-1;j>=0;j--)if('aeiouü'.includes(b[j])){k=j;break;}}if(k<0)return b;return b.slice(0,k)+TM[b[k]][t-1]+b.slice(k+1);}
const pyNorm=s=>s.replace(/([A-Za-zÜüVv]+)([1-5])/g,(m,b,t)=>{const up=b[0]!==b[0].toLowerCase();let w=tone1(b.toLowerCase().replace(/v/g,'ü'),+t);return up?w[0].toUpperCase()+w.slice(1):w;});
const toks=s=>pyNorm(s).toLowerCase().replace(/[!?.,！？。，…:;«»"]/g,' ').split(/\s+/).filter(Boolean);
const KNOWN=[['xiǎo míng','小明'],['mǎ kě','马可'],['lǐ nà','李娜']].concat(NAMES.map(n=>[n.py.join(' '),n.hz]));
function checkLine(s,kind){const t=toks(s),u=t.map(unmark);
 if(kind==='hi'){const i=u.indexOf('ni');if(i<0||u[i+1]!=='hao')return {ok:false,msg:'Здесь здороваемся: <b>nǐ hǎo!</b>'};
  if(t[i]==='nǐ'&&t[i+1]==='hǎo')return {ok:true,msg:'✓ nǐ hǎo — 3 + 3'};
  if(t[i]==='ni'||t[i+1]==='hao')return {ok:false,msg:'Поставь тоны! Подсказка: ni3 hao3 → nǐ hǎo'};
  if(t[i]==='ní')return {ok:false,msg:'Говорим ní hǎo, а <b>пишем как в словаре</b>: nǐ hǎo (3 + 3)'};
  return {ok:false,msg:'Проверь тоны: nǐ hǎo — оба третьи'};}
 const i=u.indexOf('wo');if(i<0||u[i+1]!=='jiao')return {ok:false,msg:'Здесь знакомимся: <b>wǒ jiào …</b> и имя'};
 if(t[i]!=='wǒ'||t[i+1]!=='jiào')return {ok:false,msg:t[i]==='wo'||t[i+1]==='jiao'?'Поставь тоны! wo3 jiao4 → wǒ jiào':'Проверь тоны: wǒ — 3-й, jiào — 4-й'};
 if(t.length<i+3)return {ok:false,msg:'А имя? После wǒ jiào скажи, как тебя зовут'};
 return {ok:true,msg:'✓ wǒ jiào — 3 + 4'};}
function lineAudio(s,kind){if(kind==='hi')return [urlW('nǐ hǎo','你好')];const t=toks(s),i=t.map(unmark).indexOf('wo'),nm=t.slice(i+2).join(' ');
 const k=KNOWN.find(([p])=>p===nm||unmark(p)===unmark(nm));return k?[fn('我叫'+k[1])]:[urlW('wǒ jiào','我叫')];}
function miniDlg(idx){const d=S.done.mini||{};const me=myName();const L=[['A','hi','Ты здороваешься'],['B','hi','Друг отвечает'],['A','name','Ты называешь себя'],['B','name','Друг называет себя']];

  <div class="tip">Образец: A: <b>nǐ hǎo!</b> · B: <b>nǐ hǎo!</b> · A: <b>wǒ jiào ${me?me.py.join(' '):'…'}.</b> · B: <b>wǒ jiào …</b></div>
  ${L.map(([w,k,ru],i)=>`<div class="mline"><b style="background:${w==='A'?'var(--ac)':'var(--t2)'}">${w}</b><input class="in" id="ml${i}" placeholder="${ru}" value="${esc(val[i]||'')}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="pv" id="pv${i}"></div></div>`).join('')}
  <div class="tkeys">${['ā','á','ǎ','à','ō','ó','ǒ','ò','ē','é','ě','è','ī','í','ǐ','ì','ū','ú','ǔ','ù'].map(x=>`<button class="n" data-tk="${x}">${x}</button>`).join('')}</div>

 let lastIn=$('#ml0');L.forEach((_,i)=>{const e=$('#ml'+i);e.onfocus=()=>lastIn=e;e.oninput=()=>{const p=pyNorm(e.value);$('#pv'+i).className='pv';$('#pv'+i).textContent=p!==e.value?'→ '+p:'';};});
 document.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{const e=lastIn,p=e.selectionStart??e.value.length;e.value=e.value.slice(0,p)+b.dataset.tk+e.value.slice(e.selectionEnd??p);e.focus();e.selectionStart=e.selectionEnd=p+1;});
 $('#chk').onclick=()=>{let ok=0;const text=L.map((_,i)=>pyNorm($('#ml'+i).value.trim()));

function game(idx){const best=(S.done.game&&S.done.game.best)||0;
 shell(`${STEP}<h2>🚀 Шутер: сбей иероглиф с ключом</h2><p class="lead">Вверху написан ключ — сбей астероид с иероглифом, в котором есть этот ключ! 3 жизни, с каждой волной быстрее.</p>
  <div class="sky" id="sky"><div class="st1"></div><div class="st2"></div><div class="st3"></div><div class="planet"></div>
   <div class="hudin"><span>⭐ <b id="sc">0</b></span><span id="wv">Волна 1</span><span id="lv">❤️❤️❤️</span></div><div class="tgt" id="tgt"></div>
   <div class="ship" id="ship">${ROCKET}</div>
   <div id="cover" class="cover"><div style="font:900 30px Nunito;color:#fff">Охота за ключами</div><div style="color:#C9CCF5;font-weight:700">Рекорд: ${best}</div><button class="btn" id="st" style="font-size:20px;padding:16px 34px;margin-top:10px">▶ Старт</button></div></div>`,idx);
 $('#st').onclick=()=>{$('#cover').remove();run();};
 function run(){const sky=$('#sky'),ship=$('#ship'),W=()=>sky.clientWidth,H=()=>sky.clientHeight;let score=0,lives=3,over=false,key=null,ans=null,rocks=[],last=performance.now(),speed=24,miss=[],prevK='',seed=1,prevSlot=-1;
  preload(HZ.map(h=>fn(h[0])));
  const hud=()=>{$('#sc').textContent=score;$('#lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('#wv').textContent='Волна '+(1+Math.floor(score/5));};
  const spawn=()=>{rocks.forEach(r=>r.el.remove());rocks=[];
   let k;for(let j=0;j<20;j++){k=KEYS[Math.random()*KEYS.length|0][0];if(k!==prevK)break;}key=k;prevK=k;
   ans=shuffle(HZ.filter(h=>h[3]===key))[0][0];$('#tgt').innerHTML=`Сбей ключ <span class="zh">${key}</span> ${KC[key][3]} ${KC[key][2]}`;
   const n=score<5?2:3;const others=shuffle(HZ.filter(h=>h[3]!==key).map(h=>h[0]).concat(OTHER)).slice(0,n-1);
   const slots=n===2?[.28,.72]:[.17,.5,.83];const [ord,ti]=arrange(others.concat(ans),ans,prevSlot);prevSlot=ti;
   ord.forEach((s,j)=>{const el=document.createElement('button');el.className='ast hz';el.innerHTML=`<span class="rk" style="animation-duration:${6+j*2}s">${ROCK(seed++)}</span><b>${s}</b>`;
    const r={el,s,x:slots[j],y:-100-Math.random()*50};el.style.left=(r.x*100)+'%';el.style.top=r.y+'px';el.onclick=()=>hit(r);sky.appendChild(el);rocks.push(r);});};
  const aim=r=>{const sx=W()/2,sy=H()-70,tx=r.x*W(),ty=r.y+46;const ang=Math.atan2(tx-sx,sy-ty)*180/Math.PI;ship.style.transform=`translateX(-50%) rotate(${ang}deg)`;setTimeout(()=>{if(!over)ship.style.transform='translateX(-50%)';},450);
   const l=document.createElement('div');l.className='laser';const len=Math.hypot(tx-sx,sy-ty);l.style.left=(sx-3)+'px';l.style.top=(sy-len)+'px';l.style.height=len+'px';l.style.transform=`rotate(${ang}deg)`;sky.appendChild(l);setTimeout(()=>l.remove(),280);};
  const burst=(x,y,txt)=>{for(let j=0;j<10;j++){const p=document.createElement('i');p.className='spark';const a=j/10*Math.PI*2;p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*60+'px');p.style.setProperty('--dy',Math.sin(a)*60+'px');sky.appendChild(p);setTimeout(()=>p.remove(),600);}
   const s=document.createElement('div');s.className='plus';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';sky.appendChild(s);setTimeout(()=>s.remove(),800);};
  const lose=()=>{lives--;hud();sky.classList.add('hit');setTimeout(()=>sky.classList.remove('hit'),300);if(lives<=0)end();};
  const hit=r=>{if(over)return;aim(r);
   if(r.s===ans){r.el.classList.add('boom');playH(ans);burst(r.x*W(),r.y+46,'+1');score++;speed=Math.min(80,24+score*2);hud();rocks=rocks.filter(x=>x!==r);setTimeout(()=>{if(!over)spawn();},600);}
   else{r.el.classList.add('shake');setTimeout(()=>r.el.classList.remove('shake'),360);miss.push(r.s+'≠'+key);toast(`В ${r.s} нет ключа ${key}`);lose();}};
  const tick=t=>{if(over||!document.body.contains(sky))return;const dt=Math.min(.05,(t-last)/1000);last=t;for(const r of rocks){r.y+=speed*dt;r.el.style.top=r.y+'px';}
   const tr=rocks.find(r=>r.s===ans);if(tr&&tr.y>H()-150){miss.push(ans);toast(`Пропустил! Ключ ${key} был в ${ans}`);lose();if(!over)spawn();}requestAnimationFrame(tick);};
  const end=()=>{over=true;rocks.forEach(r=>r.el.remove());$('#tgt').innerHTML='';const prev=S.done.game||{};const b=Math.max(prev.best||0,score);send('game',{best:b,last:score,games:(prev.games||0)+1,miss:miss.slice(-10)});
   const c=document.createElement('div');c.className='cover';c.innerHTML=`<div style="font:900 28px Nunito;color:#fff">Игра окончена!</div><div style="font:900 60px Nunito;color:#FFE27A">${score}</div><div style="font-weight:800;color:#C9CCF5">${score>=b&&score>0?'🏆 Новый рекорд!':'Рекорд: '+b}</div><button class="btn" id="re" style="margin-top:8px">Ещё раз</button>`;sky.appendChild(c);$('#re').onclick=()=>game(idx);};
  hud();spawn();requestAnimationFrame(t=>{last=t;tick(t);});}}

  return {x,i,sc,lv,msg};});
 const dn=doneCnt(),stars=rows.filter(r=>r.lv===3).length,again=rows.filter(r=>r.lv===1||r.lv===2);
 const head=dn>=NT?'🎉 Все задания сделаны!':dn>=NT/2?'💪 Больше половины позади!':dn?'🚀 Хорошее начало!':'👋 Начнём?';
 shell(`<h2>🏁 Мои результаты</h2><div class="sum n"><div class="big2">${dn} / ${NT}</div><div><b>${head}</b><small>${'⭐'.repeat(stars)}${stars?` ${stars} ${stars===1?'задание':stars<5?'задания':'заданий'} на отлично`:'Звёзды появятся за задания на отлично'}</small></div></div>
  ${again.length?`<div class="tip">🔁 Для закрепления можно пройти ещё разок: <b>${again.map(r=>r.x.t).join(', ')}</b>. Это не страшно — так и тренируются!</div>`:''}
  <div class="rlist">${rows.map(r=>`<button class="rr n" data-go="${r.x.id}"><span class="e" style="background:${r.x.bg}">${r.x.e}</span><span><b>${r.i+1}. ${r.x.t}</b><small>${r.msg}</small></span><span class="rs l${r.lv}">${r.sc||(r.lv?'✓':'—')}</span></button>`).join('')}</div>
  <p class="lead" style="text-align:center">Нажми на задание, чтобы пройти его ещё раз. Ошибаться не страшно — не попробовать жалко!</p>`,idx);
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='#'+b.dataset.go);}

// a shared link may carry #task from someone's address bar — always start from the menu
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
route();
</script></body></html>

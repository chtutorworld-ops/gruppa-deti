 let a=0,e=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(e>a&&Math.abs(d[e])<th)e--;a=Math.max(0,a-Math.round(sr*.015));e=Math.min(d.length,e+Math.round(sr*.06));
 if(e-a<sr*.05)return b;const o=acx().createBuffer(1,e-a,sr);o.copyToChannel(d.slice(a,e),0);return o;}
function loadB(u){return BUF[u]||(BUF[u]=fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);})).then(trimB).catch(e=>{delete BUF[u];throw e;}));}
const preload=us=>us.filter(Boolean).forEach(u=>loadB(u).catch(()=>{}));
function stopAll(){playTok++;try{curA&&curA.pause()}catch(e){}curSrc.forEach(x=>{try{x.stop()}catch(e){}});curSrc=[];}
function playOld(u,el){return new Promise(res=>{const a=new Audio(u);curA=a;el&&el.classList.add('on');const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;a.onerror=end;a.play().catch(end);});}
// several files back to back with a short gap, no network pause between them
async function playList(urls,el,gap){urls=urls.filter(Boolean);if(!urls.length)return;stopAll();const tok=playTok;el&&el.classList.add('on');
 let bufs=null;const ctx=acx();try{ctx.resume();bufs=await Promise.all(urls.map(loadB));}catch(e){bufs=null;}
 if(tok!==playTok){return;}
 if(!bufs){for(const u of urls){if(tok!==playTok)return;await playOld(u);}el&&el.classList.remove('on');return;}
 let t=ctx.currentTime+0.02;const g=gap==null?0.25:gap;curSrc=bufs.map(b=>{const x=ctx.createBufferSource();x.buffer=b;x.connect(ctx.destination);x.start(t);t+=b.duration+g;return x;});
 await new Promise(r=>setTimeout(r,Math.max(0,(t-g-ctx.currentTime)*1000)));if(tok===playTok)el&&el.classList.remove('on');}
const urlS=s=>{const k=vkey(s);if(VOK&&VOK[k])return VOICE+k+'.wav';const c=SYL.char(s);return c?fn(c):null;};
const urlK=k=>VOK&&VOK[k]?VOICE+k+'.wav':null;              // b0, p0 …: the teacher's pure initial sound

// a training pair of syllables in the teacher's voice, said with the tone change:
// 3 + 3 → the first syllable is taken with the 2nd tone; 3 + 4 → the first 3rd tone is cut after its low part (no rise)
async function playPair(py,el){const [a,b]=py.split(' '),ta=SYL.tone(a),tb=SYL.tone(b);stopAll();const tok=playTok;
 const first=ta===3&&tb===3?mark(SYL.plain(a),2):a;const half=ta===3&&tb!==3;
 const ctx=acx();let A,B;try{ctx.resume();[A,B]=await Promise.all([urlS(first),urlS(b)].map(loadB));}catch(e){return playList([urlS(first),urlS(b)],el,.05);}
 if(tok!==playTok)return;
 if(half){const d=A.getChannelData(0),n=Math.floor(d.length*.6),o=ctx.createBuffer(1,n,A.sampleRate),c=d.slice(0,n),f=Math.floor(A.sampleRate*.04);
  for(let i=0;i<f;i++)c[n-1-i]*=i/f;o.copyToChannel(c,0);A=o;}
 el&&el.classList.add('on');let t=ctx.currentTime+.02;[A,B].forEach(x=>{const src=ctx.createBufferSource();src.buffer=x;src.connect(ctx.destination);src.start(t);curSrc.push(src);t+=x.duration+.04;});
 await new Promise(r=>setTimeout(r,Math.max(0,(t-ctx.currentTime)*1000)));if(tok===playTok)el&&el.classList.remove('on');}
// the same pair with a partner initial: b/p, d/t, g/k, m/n, n/l, f/h
const SWAP={b:'p',p:'b',d:'t',t:'d',g:'k',k:'g',m:'n',n:'l',l:'n',f:'h',h:'f'};
const swapIni=w=>{const c=w[0];return SWAP[c]?SWAP[c]+w.slice(1):w;};
const pairQuiz=list=>noTriple(list,x=>x[0]).map(py=>{const [a,b]=py.split(' ');const o=[py,swapIni(a)+' '+b,a+' '+swapIni(b)];
 return {play:el=>playPair(py,el),q:'Какую пару ты услышал?',opts:o.map(x=>`<span class="py">${tpy(x)}</span>`),right:`<span class="py">${tpy(py)}</span>`,ok:tpy(py)};});

const urlW=hz=>{const w=[...W33,...W34,['你好','nǐ hǎo'],['我叫','wǒ jiào']].find(x=>x[0]===hz);const k=w&&wid(w[1]);return k&&VOK&&VOK[k]?VOICE+k+'.wav':fn(hz);};

/* ===================== pitch (YIN), as in ДЗ 2 ===================== */
async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
// melody of the whole word: pitched frames only, gaps between syllables kept as gaps
function melody(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2;let mx=0;const rms=[];
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.12),f=[];let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=thr?yin(pcm.subarray(i,i+F),sr):[0,1];f.push(v>65&&v<550&&ap<0.2?v:0);}
 for(let i=0;i<f.length;i++){if(!f[i])continue;const nb=[];for(let d=1;d<=5;d++){if(f[i-d])nb.push(f[i-d]);if(f[i+d])nb.push(f[i+d]);}
  if(!nb.length){f[i]=0;continue;}nb.sort((p,q)=>p-q);if(Math.abs(12*Math.log2(f[i]/nb[nb.length>>1]))>5)f[i]=0;}
 let a=f.findIndex(x=>x>0),b=f.length-1;while(b>=0&&!f[b])b--;if(a<0||b-a<8)return null;
 const seg=f.slice(a,b+1),vs=seg.filter(x=>x>0).sort((p,q)=>p-q);if(vs.length<8)return null;const med=vs[vs.length>>1];
 return seg.map(x=>x>0?Math.max(-9,Math.min(9,12*Math.log2(x/med))):null);}
function melSvg(lines){const W=520,H=170,y=v=>H/2-v*(H-30)/18;let out=`<svg class="mel" viewBox="0 0 ${W} ${H}">${[-6,-3,0,3,6].map(v=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE1EA" stroke-width="1"/>`).join('')}`;
 lines.forEach(([m,col,w,dash])=>{if(!m)return;const n=m.length;let d='',pen=false;m.forEach((v,i)=>{if(v===null){pen=false;return;}const x=14+i*(W-28)/(n-1);d+=(pen?'L':'M')+x.toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;});
  out+=`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${dash?'stroke-dasharray="2 9"':''}/>`;});
 return out+'</svg>';}
const melCache={};
async function refMel(hz){if(melCache[hz])return melCache[hz];try{const r=await fetch(urlW(hz));return melCache[hz]=melody(await toPCM(await r.arrayBuffer()));}catch(e){return null;}}

let micStream=null;
async function getMic(){if(micStream&&micStream.active)return micStream;micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});return micStream;}
function pickType(){for(const t of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))return t;return '';}
async function record(maxMs,onStart){const s=await getMic();const type=pickType();
 const mr=new MediaRecorder(s,type?{mimeType:type,audioBitsPerSecond:32000}:{});const ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const done=new Promise(r=>mr.onstop=()=>r(new Blob(ch,{type:mr.mimeType||type||'audio/webm'})));mr.start();onStart&&onStart(()=>mr.state==='recording'&&mr.stop());setTimeout(()=>mr.state==='recording'&&mr.stop(),maxMs);return done;}

const curve=(tones,w=96,h=78,cross)=>{const W=w*tones.length,y=v=>h-8-(v-1)*(h-16)/4;
 return `<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" style="max-width:100%" aria-hidden="true">${[1,2,3,4,5].map(v=>`<line x1="4" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="#D3D8E6" stroke-width="1.5"/>`).join('')}
 ${tones.map((t,k)=>{const x=u=>k*w+12+u*(w-24);return `<path d="${TPTS[t].map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ')}" stroke="${TCOL[t]}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+(cross===k?`<path d="M${k*w+16} 12L${k*w+w-16} ${h-12}M${k*w+w-16} 12L${k*w+16} ${h-12}" stroke="#FF5C8A" stroke-width="4" stroke-linecap="round" opacity=".75"/>`:'');}).join('')}</svg>`;};

function quiz(box,key,title,items,cols){const el=$(box);if(!el)return;let i=0,ok=0,res=[];LASTPOS=[];
 const P=items.map(it=>Object.assign({},it,{o:arrange(it.opts,it.right)}));

  const pl=el.querySelector('[data-pl]'),fb=el.querySelector('.fb');const go=()=>it.play&&(typeof it.play==='function'?it.play(pl):playList(it.play,pl));

  <div class="tip">🎧 Включи звук. 🎤 В трёх шагах понадобится микрофон: ты скажешь слово и увидишь мелодию своего голоса.</div>`,
  on:()=>document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ST.name=b.dataset.who;keep();document.querySelectorAll('[data-who]').forEach(x=>x.classList.toggle('on',x===b));toast('Привет, '+ST.name+'! 你好！');})},

 {t:'Четыре тона',h:()=>`${R3}<h2>Четыре тона</h2><div class="hz"><span class="zh">四声</span><span class="py">sì shēng</span></div>
  <p class="lead">Сочетания тонов строятся из обычных тонов, поэтому сначала вспомним их. Нажимай на слоги — это голос учителя. Повторяй вслух.</p>
  <div class="tc">${[[1,'высокий ровный','Голос стоит <b>высоко и ровно</b>, как долгая нота 🎵',['mā','bā','dī']],[2,'восходящий','Голос идёт <b>снизу вверх</b>, как удивлённое «А?» 🤨',['má','bá','ní']],[3,'вниз и вверх','Голос опускается <b>до самого низа</b>, задерживается и <b>поднимается</b>. «Галочка», самый длинный тон 🤔',['mǎ','bǐ','nǐ']],[4,'нисходящий','Голос <b>резко падает сверху вниз</b>, как строгое «Нет!» ✋',['mà','dà','tù']]].map(([t,n,how,ex])=>`<div class="card n" style="border-left:6px solid ${TCOL[t]}">${curve([t],76,64)}<div><b style="color:${TCOL[t]};font-size:17px">${t}-й тон · ${n}</b><div style="margin-top:4px">${how}</div><div class="chips">${ex.map(s=>`<button class="chip n" data-s="${s}" style="color:${TCOL[t]}">${s} 🔊</button>`).join('')}</div></div></div>`).join('')}</div>
  <div class="qbox in" id="q1"></div>`,
  on:()=>quiz('#q1','tones','Какой тон?',shuffle([['ma',3],['ba',2],['mi',4],['di',1],['bi',3],['ni',2]]).slice(0,4).map(([b,t])=>({play:[urlS(mark(b,t))],q:'Послушай и выбери тон',opts:[1,2,3,4].map(x=>`<span class="py" style="color:${TCOL[x]}">${mark(b,x)}</span>`),right:`<span class="py" style="color:${TCOL[t]}">${mark(b,t)}</span>`,ok:`${t}-й тон`})),4)},

 {t:'Инициали урока 3',h:()=>`${R3}<h2>Инициали b p m f d t n l g k h</h2><div class="hz"><span class="zh">声母</span><span class="py">shēngmǔ</span></div>
  <p class="lead">Инициаль — согласный в начале слога. Нажми на каждую: прозвучит её <b>чистый звук</b>, без гласной. Повтори вслух.</p>
  <div class="ini">${[['b','без выдоха'],['p','«п» с выдохом'],['m','как «м»'],['f','как «ф»'],['d','«грозное», без выдоха'],['t','«т» с выдохом'],['n','мягкое, «няня»'],['l','мягкое, «ляля»'],['g','без выдоха'],['k','«к» с выдохом'],['h','хриплое «х»']].map(([c,r])=>`<button class="n${'ptk'.includes(c)?' asp':''}" data-k="${c}0"><b>${c}</b><small>${r}</small></button>`).join('')}</div>
  <div class="cards c2">
   <div class="card n"><span class="ic">📄</span><b class="h">p, t, k — с выдохом</b>Поднеси листок бумаги ко рту: на <b>p, t, k</b> он шевелится, на <b>b, d, g</b> — нет.</div>
   <div class="card n"><span class="ic">⚡</span><b class="h">d — самый «грозный»</b>Кончик языка бьёт в заднюю часть верхних зубов. «Д» как в слове «Дмитрий», а не «Дима». <b>di</b> — коварный слог: «ДйИ», иначе выйдет ji.</div>
   <div class="card n"><span class="ic">🍼</span><b class="h">n и l — мягонькие</b>Как в словах «няня» и «ляля», а не «нос» и «лось».</div>
   <div class="card n"><span class="ic">🔥</span><b class="h">h — хриплое</b>Выдох из горла, как будто греешь руки зимой.</div>
  </div>`,
  on:()=>{document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>playList([urlK(b.dataset.k)],b));preload('bpmfdtnlgkh'.split('').map(c=>urlK(c+'0')));}},

 {t:'С выдохом и без',h:()=>`${R3}<h2>С выдохом и без</h2>
  <p class="lead">Нажимай по парам и слушай разницу. Слева без выдоха, справа с выдохом.</p>
  <div class="chips">${[['bō','pō'],['dé','tè'],['gē','kē'],['bà','pà'],['dú','tú'],['gǔ','kǔ']].map(([a,b])=>`<span style="display:inline-flex;gap:6px"><button class="chip n" data-s="${a}">${a} 🔊</button><button class="chip n" data-s="${b}" style="color:var(--t4)">${b} 🔊</button></span>`).join('')}</div>
  <div class="qbox in" id="q2"></div>`,
  on:()=>{const P=shuffle([['pa',4,'ba'],['ti',2,'di'],['ku',3,'gu'],['bo',1,'po'],['da',4,'ta'],['ke',1,'ge']]);let order=P;for(let k=0;k<100;k++){order=shuffle(P);if(order.every((x,i)=>!i||x[0][0]!==order[i-1][0][0]&&x[0][0]!==order[i-1][2][0]))break;}
   quiz('#q2','asp','С выдохом или без?',order.map(([b,t,alt])=>({play:[urlS(mark(b,t))],q:'Какой слог прозвучал?',opts:[mark(b,t),mark(alt,t)],right:mark(b,t),ok:'Да, '+mark(b,t)+('ptk'.includes(b[0])?' — с выдохом':' — без выдоха')})),2);}},

 {t:'Слова живут парами',h:()=>`${R4}<h2>Тоны в словах влияют друг на друга</h2>
  <p class="lead">Почти все китайские слова — из <b>двух слогов</b>. Когда два тона стоят рядом, один из них иногда <b>меняется</b>. Сегодня два главных правила — оба про <b>3-й тон</b>:</p>
  <div class="cmp">
   <div class="card n"><span class="k">Правило 1</span><div class="tn"><span style="color:var(--t3)">3</span> + <span style="color:var(--t3)">3</span></div>${curve([2,3],90,70)}<div>первый 3-й → <b style="color:var(--t2)">2-й</b></div></div>
   <div class="card n"><span class="k">Правило 2</span><div class="tn"><span style="color:var(--t3)">3</span> + <span style="color:var(--t4)">4</span></div>${curve(['h',4],90,70)}<div>3-й звучит <b>наполовину</b>: только вниз</div></div>
  </div>
  <div class="motto"><div class="zh say" data-w="犯错不可怕，不试才可惜" style="cursor:pointer">犯错不可怕，<br>不试才可惜</div><div class="py">fàn cuò bù kěpà, bù shì cái kěxī</div><div class="ru">Ошибаться не страшно — жалко не пробовать</div></div>`},

 {t:'Тоны 3 + 3',h:()=>`${R4}<h2>Два третьих тона подряд</h2><div class="hz"><span class="zh">三声变调</span><span class="py">sān shēng biàndiào</span></div>
  <div class="cmp">
   <div class="card n"><span class="k">Пишем</span><div class="tn"><span style="color:var(--t3)">3</span> + <span style="color:var(--t3)">3</span></div>${curve([3,3],100,80,0)}</div>
   <div class="card n"><span class="k">Говорим</span><div class="tn"><span style="color:var(--t2)">2</span> + <span style="color:var(--t3)">3</span></div>${curve([2,3],100,80)}</div>
  </div>
  <p class="lead">Две «галочки» подряд говорить трудно. Поэтому <b>первый 3-й тон превращается во 2-й</b>: голос идёт снизу вверх. А второй слог остаётся обычным 3-м.</p>
  <div class="tip">✍️ Пишем тоны <b>как в словаре</b>: <span class="ipy">dǎ gǔ</span>. Меняется только голос: <span class="ipy"><span style="color:var(--t2)">dá</span> <span style="color:var(--t3)">gǔ</span></span>. Значок над буквой не исправляем!</div>
  <div class="row" style="justify-content:center"><button class="btn" data-w="打鼓" style="font-size:20px"><span class="zh" style="font-size:30px">打鼓</span> dǎ gǔ → звучит dá gǔ 🔊</button></div>
  <p class="lead" style="text-align:center;font-size:15px;color:var(--mu)">打鼓 — бить в барабан</p>
  ${chk('Как <b>звучит</b> слово <span class="ipy">mǔ mǎ</span>?',['<span class="ipy">mú mǎ</span> — первый слог 2-м тоном','<span class="ipy">mǔ mǎ</span> — две «галочки»','<span class="ipy">mù mǎ</span> — первый слог 4-м тоном'],0,'3 + 3 говорим как 2 + 3.')}
  ${chk('Как это слово <b>пишется</b> в пиньине?',['Как в словаре: <span class="ipy">mǔ mǎ</span>','Как слышим: <span class="ipy">mú mǎ</span>'],0,'Пишем как в словаре, меняем только голос.',true)}`},

 {t:'Слушай и повторяй: 3 + 3',h:()=>`${R4}<h2>Слушай и повторяй: 3 + 3</h2>
  <p class="lead">Нажми на слово, послушай и повтори вслух <b>2–3 раза</b>. Под каждым словом написано, как оно <b>звучит</b>.</p>
  ${wordBtns(W33,true)}
  <h3>Тренируем на слогах</h3><p class="lead" style="margin-top:0">Это не слова, а пары слогов для тренировки. Нажми на пару, послушай и повтори вслух. Первый слог звучит <b>2-м тоном</b> — это правило 3 + 3.</p>
  <div class="pp">${P33.map(([p,s])=>`<button class="n" data-pair="${p}"><span>${tpy(p)} 🔊</span><small>звучит: ${s}</small></button>`).join('')}</div>`},

 {t:'Узнай пару: 3 + 3',h:()=>`${R4}<h2>👂 Узнай пару слогов</h2><p class="lead">Послушай пару слогов и выбери, какую пару ты услышал. Слушай внимательно <b>первый звук</b> каждого слога: b или p, m или n, f или h…</p><div class="qbox in" id="qp3"></div>`,
  on:()=>quiz('#qp3','p33','Узнай пару 3 + 3',pairQuiz(['bǐ mǎ','tǔ gǔ','nǐ pǔ','kě dǐ','fǎ lǐ','hǔ bǎ']),3)},

 {t:'Скажи сам: 3 + 3',h:()=>`${R4}<h2>🎤 Скажи сам и посмотри на мелодию</h2>
  <p class="lead">1) Послушай образец ▶. 2) Нажми «● Скажи» и произнеси слово. 3) Сравни линии: серая — образец, синяя — твой голос. В 3 + 3 в начале голос должен <b>подниматься</b>, а потом сделать <b>галочку</b>.</p>
  ${recBox('r33',W33)}
  <div class="tip">💡 Если линия не появилась, скажи громче и ближе к микрофону. Запись никуда не отправляется — она только для тебя.</div>`,
  on:()=>bindRec('r33',W33)},

 {t:'Проверка: 3 + 3',h:()=>`${R4}<h2>Проверка: 3 + 3</h2><p class="lead">Послушай слово и выбери, как оно <b>записано</b>. Помни: звучит 2 + 3, а пишем 3 + 3!</p><div class="qbox in" id="q3"></div>`,
  on:()=>quiz('#q3','w33','Тоны 3 + 3',[['打鼓','dǎ gǔ','dá gǔ','dà gǔ'],['母马','mǔ mǎ','mú mǎ','mù mǎ'],['马匹','mǎ pǐ','má pǐ','mà pǐ'],['打卡','dǎ kǎ','dá kǎ','dā kǎ'],['你好','nǐ hǎo','ní hǎo','nì hǎo'],['打靶','dǎ bǎ','dá bǎ','dà bǎ']].map(([hz,py,say,w2])=>({play:[urlW(hz)],q:'Как это слово <b>записано</b>?',opts:[py,say,w2].map(x=>`<span class="py">${tpy(x)}</span>`),right:`<span class="py">${tpy(py)}</span>`,
   ok:`<span class="zh">${hz}</span> ${py} — звучит ${say}`,trap:{[`<span class="py">${tpy(say)}</span>`]:`Звучит именно так! Но пишем как в словаре: <b>${py}</b>.`}})),3)},

 {t:'Тоны 3 + 4',h:()=>`${R4}<h2>Неполный 3-й тон</h2><div class="hz"><span class="zh">半三声</span><span class="py">bàn sān shēng</span></div>
  <div class="cmp">
   <div class="card n"><span class="k">Один 3-й тон</span>${curve([3],120,80)}<div>вниз — и вверх</div></div>
   <div class="card n"><span class="k">3-й перед 4-м</span>${curve(['h',4],100,80)}<div>только <b>вниз</b>, потом резкий 4-й</div></div>
  </div>
  <p class="lead">Перед 1-м, 2-м и 4-м тоном 3-й тон звучит <b>наполовину</b>: голос опускается <b>низко-низко</b> — и <b>не поднимается</b>. Сразу за ним резкий 4-й тон <b>сверху вниз</b>. Не делай «галочку»!</p>
  <div class="row" style="justify-content:center"><button class="btn" data-w="可怕" style="font-size:20px"><span class="zh" style="font-size:30px">可怕</span> kě pà 🔊</button></div>
  <p class="lead" style="text-align:center;font-size:15px;color:var(--mu)">可怕 — страшно. <span class="zh-i">犯错不可怕</span> — ошибаться не страшно!</p>
  <div class="tip">✍️ Здесь тоже пишем как в словаре: <span class="ipy">kě pà</span>. Значок 3-го тона остаётся, просто голос не поднимается.</div>
  ${chk('Что делает голос на <span class="ipy">kě</span> в слове <span class="ipy">kě pà</span>?',['Опускается вниз и не поднимается','Делает полную «галочку»','Поднимается, как 2-й тон'],0,'Это неполный 3-й тон.')}`},

 {t:'Слушай и повторяй: 3 + 4',h:()=>`${R4}<h2>Слушай и повторяй: 3 + 4</h2>
  <p class="lead">Нажми на слово, послушай и повтори вслух <b>2–3 раза</b>: <b>низко</b> — и <b>резко вниз</b>.</p>
  ${wordBtns(W34)}
  <h3>Тренируем на слогах</h3><p class="lead" style="margin-top:0">Пары слогов для тренировки. Нажми, послушай и повтори вслух: первый слог <b>низко и коротко</b>, второй — <b>резко сверху вниз</b>.</p>
  <div class="pp">${P34.map(p=>`<button class="n open" data-pair="${p}"><span>${tpy(p)} 🔊</span></button>`).join('')}</div>`},

 {t:'Узнай пару: 3 + 4',h:()=>`${R4}<h2>👂 Узнай пару слогов</h2><p class="lead">Послушай пару слогов 3 + 4 и выбери, какую пару ты услышал.</p><div class="qbox in" id="qp4"></div>`,
  on:()=>quiz('#qp4','p34','Узнай пару 3 + 4',pairQuiz(['mǐ pò','kǔ là','fǎ dù','hǔ tè','nǐ kù','gǔ mù']),3)},

 {t:'Скажи сам: 3 + 4',h:()=>`${R4}<h2>🎤 Скажи сам: 3 + 4</h2>
  <p class="lead">Послушай образец ▶, нажми «● Скажи» и сравни линии. В 3 + 4 голос сначала <b>низко</b> и не поднимается, потом <b>падает сверху вниз</b>.</p>
  ${recBox('r34',W34.slice(0,4))}`,
  on:()=>bindRec('r34',W34.slice(0,4))},

 {t:'3 + 3 или 3 + 4?',h:()=>`${R4}<h2>3 + 3 или 3 + 4?</h2><p class="lead">Послушай слово. Если первый слог <b>поднимается</b> — это 3 + 3 (звучит как 2 + 3). Если первый слог <b>низкий и короткий</b>, а второй падает — это 3 + 4.</p><div class="qbox in" id="q4"></div>`,
  on:()=>{const A='3 + 3 <small style="display:block;font-size:13px;color:var(--mu)">звучит 2 + 3</small>',B='3 + 4 <small style="display:block;font-size:13px;color:var(--mu)">неполный 3-й</small>';
   const L=noTriple([['打鼓',A],['可怕',B],['母马',A],['马路',B],['马匹',A],['可乐',B],['打卡',A],['土地',B]],x=>x[1]);
   quiz('#q4','mix','3 + 3 или 3 + 4',L.map(([hz,r])=>({play:[urlW(hz)],q:'Какое сочетание тонов?',opts:[A,B],right:r,ok:`<span class="zh">${hz}</span> — ${r===A?'3 + 3':'3 + 4'}`})),2);}},

 {t:'你好 — Привет',h:()=>`${R4}<h2>你好 — Здравствуй! Привет!</h2>
  <div class="motto"><div class="zh say" data-w="你好" style="cursor:pointer;font-size:84px">你好</div><div class="py">nǐ hǎo · звучит <span style="color:var(--t2)">ní</span> <span style="color:var(--t3)">hǎo</span></div><div class="ru">Здравствуй! Привет!</div></div>
  <div style="display:flex;justify-content:center">${curve([2,3],100,78)}</div>
  <div class="cards c2">
   <div class="card n"><b class="h">🎶 Это наши 3 + 3</b>Пишем <span class="ipy">nǐ hǎo</span>, говорим <span class="ipy"><span style="color:var(--t2)">ní</span> <span style="color:var(--t3)">hǎo</span></span>: первый слог поднимается, второй — «галочка».</div>
   <div class="card n"><b class="h">🧩 Из чего состоит</b><span class="zh-i">你</span> <span class="ipy">nǐ</span> — «ты», <span class="zh-i">好</span> <span class="ipy">hǎo</span> — «хорошо». Получается «тебе хорошо!»</div>
  </div>
  <div class="tip">👂 Финаль <b>ao</b> мы ещё не проходили — пока просто слушаем и повторяем за учителем. Нажми на <span class="zh-i">你好</span> и повтори 3 раза.</div>`},

 {t:'我叫 — Меня зовут',h:()=>`${R4}<h2>我叫 — Меня зовут…</h2>
  <div class="motto"><div class="zh say" data-w="我叫" style="cursor:pointer;font-size:84px">我叫</div><div class="py">wǒ jiào</div><div class="ru">Меня зовут…</div></div>
  <div style="display:flex;justify-content:center">${curve(['h',4],100,78)}</div>
  <div class="cards c2">
   <div class="card n"><b class="h">🎶 Это наши 3 + 4</b><span class="ipy" style="color:var(--t3)">wǒ</span> — неполный 3-й тон: низко и без подъёма. Потом резкий <span class="ipy" style="color:var(--t4)">jiào</span> сверху вниз.</div>
   <div class="card n"><b class="h">🧩 Из чего состоит</b><span class="zh-i">我</span> <span class="ipy">wǒ</span> — «я», <span class="zh-i">叫</span> <span class="ipy">jiào</span> — «зваться». Получается «я зовусь…»</div>
  </div>
  <p class="lead">После <span class="zh-i">我叫</span> сразу говорим имя. Так представляется учитель: <button class="chip n say" data-w="我叫 达莉娅"><span class="zh">我叫达莉娅。</span></button> — «Меня зовут Дарья».</p>
  <div class="tip">👂 Финали <b>uo</b> и <b>iao</b> — пока на слух. Нажми на <span class="zh-i">我叫</span> и повтори 3 раза.</div>`},

 {t:'Знакомимся',h:()=>`${R4}<h2>你好！我叫… — Знакомимся</h2>
  <p class="lead">Нажми на строчку, послушай и повтори вслух. Так здороваются и представляются по-китайски:</p>
  <div class="dlg">
   <button class="ln n" data-w="你好"><span class="zh">你好！</span><span><span class="py">nǐ hǎo! · звучит ní hǎo</span><small>Привет!</small></span></button>
   <button class="ln n" data-w="你好 我叫 达莉娅"><span class="zh">你好！我叫达莉娅。</span><span><span class="py">nǐ hǎo! wǒ jiào Dálìyà.</span><small>Привет! Меня зовут Дарья.</small></span></button>
  </div>
  <h3>Теперь ты</h3>
  <p class="lead" style="margin-top:0">Скажи: <span class="zh-i">你好！我叫</span> <b>${NAME()||'(твоё имя)'}</b>. Имя пока говорим по-русски. Нажми «● Скажи», представься, потом нажми «▶ Я» и послушай себя.</p>
  ${recBox('rme',[],'你好 我叫')}
  <div class="tip">✔️ Проверь себя: в <b>nǐ hǎo</b> первый слог поднимается (ní), в <b>wǒ jiào</b> первый слог низкий и короткий.</div>`,
  on:()=>bindRec('rme',[['你好']],'你好 我叫')},

 {t:'Проверка: 你好 и 我叫',h:()=>`${R4}<h2>Проверка: 你好 и 我叫</h2><div class="qbox in" id="q5"></div>`,
  on:()=>quiz('#q5','phr','你好 и 我叫',[
   {play:[urlW('你好')],q:'Что ты услышал?',opts:['Привет!','Меня зовут…'],right:'Привет!',ok:'<span class="zh">你好</span> — привет!'},
   {play:[urlW('我叫')],q:'Что ты услышал?',opts:['Привет!','Меня зовут…'],right:'Меня зовут…',ok:'<span class="zh">我叫</span> — меня зовут…'},
   {q:'Какое сочетание тонов в <span class="ipy">nǐ hǎo</span>?',opts:['3 + 3: звучит ní hǎo','3 + 4: wǒ звучит низко','1 + 3'],right:'3 + 3: звучит ní hǎo',ok:'Да, 3 + 3 → 2 + 3.'},
   {q:'Какое сочетание тонов в <span class="ipy">wǒ jiào</span>?',opts:['3 + 3: звучит ní hǎo','3 + 4: wǒ звучит низко','1 + 3'],right:'3 + 4: wǒ звучит низко',ok:'Да, неполный 3-й + 4-й.'},
   {q:'Как поздороваться и представиться?',opts:['nǐ hǎo! wǒ jiào …','wǒ jiào! nǐ hǎo …','hǎo nǐ! jiào wǒ …'],right:'nǐ hǎo! wǒ jiào …',ok:'Сначала «привет», потом «меня зовут» и имя.'}],2)},

 {t:'Финиш',h:()=>{const R=Object.values(ST.res);return `<span class="part"><b style="background:var(--ok)">🏁</b> финиш</span>
  <h2>${NAME()?NAME()+', ты':'Ты'} догнал группу! 🎉</h2>
  <p class="lead">Теперь ты знаешь всё, что прошли на уроке 4: сочетания тонов <b>3 + 3</b> и <b>3 + 4</b>, фразы <span class="zh-i">你好</span> и <span class="zh-i">我叫</span>. На следующем уроке продолжим все вместе.</p>
  ${R.length?`<h3>Твои проверки</h3><div class="sumr">${R.map(r=>`<div class="n"><span>${r.t}</span><b class="${r.ok>=r.of-1?'g':'y'}">${r.ok} / ${r.of}${r.ok>=r.of-1?' ✓':' · можно повторить для закрепления'}</b></div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:24px"><a class="btn okb" id="godz" href="../dz-3/" style="font-size:19px;padding:18px 30px">Домашнее задание 3 → <span id="cd">через 10 с</span></a></div>
  <p class="lead" style="text-align:center;font-size:15px;color:var(--mu)">Сейчас откроется домашнее задание. Там напиши своё имя и первую букву фамилии — так учитель увидит твою работу.</p>`;},
  on:()=>{let n=10;const t=setInterval(()=>{const c=$('#cd');if(!c){clearInterval(t);return;}n--;c.textContent=n>0?'через '+n+' с':'';if(n<=0){clearInterval(t);location.href='../dz-3/';}},1000);}}
];

// order asked by the teacher: 3 + 3 → 你好, then 3 + 4 → 我叫
{const OLD=STEPS.slice();STEPS.splice(0,STEPS.length,...['Начало','Четыре тона','Инициали урока 3','С выдохом и без','Слова живут парами','Тоны 3 + 3','Слушай и повторяй: 3 + 3','Узнай пару: 3 + 3','Скажи сам: 3 + 3','Проверка: 3 + 3','你好 — Привет','Тоны 3 + 4','Слушай и повторяй: 3 + 4','Узнай пару: 3 + 4','Скажи сам: 3 + 4','我叫 — Меня зовут','3 + 3 или 3 + 4?','Знакомимся','Проверка: 你好 и 我叫','Финиш'].map(t=>OLD.find(x=>x.t===t)));}

/* ===================== checks without sound ===================== */
function chk(q,opts,c,ex,two){const right=opts[c];const order=arrange(opts.map((o,i)=>i),c);
 return `<div class="chk in" data-c="${c}"><div class="q">${q}</div><div class="mcq ${two?'two':''}">${order.map(i=>`<button class="opt n" data-i="${i}">${opts[i]}</button>`).join('')}</div><div class="fb" data-ex="${encodeURIComponent(ex||'')}"></div></div>`;}
function bind(){document.querySelectorAll('.chk').forEach(box=>{const c=+box.dataset.c,fb=box.querySelector('.fb');let done=false;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;
  if(+b.dataset.i===c){done=true;b.classList.add('ok');fb.className='fb ok';fb.innerHTML='✓ Верно! '+decodeURIComponent(fb.dataset.ex);}
  else{b.classList.add('no');fb.className='fb no';fb.textContent='Не совсем — попробуй ещё раз. 犯错不可怕!';}});});
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>playW(b.dataset.w,b));
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>playS(b.dataset.s,b));
 document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{b.classList.add('open');playPair(b.dataset.pair,b);});
 const ps=document.querySelectorAll('[data-pair]');if(ps.length)preload([...ps].flatMap(b=>b.dataset.pair.split(' ').map(x=>[urlS(x),urlS(mark(SYL.plain(x),2))])).flat());}

/* ===================== shell ===================== */
let cur=0;try{cur=Math.min(STEPS.length-1,+localStorage.getItem('zh-dogon4-step')||0);}catch(e){}
function render(){const s=STEPS[cur];try{localStorage.setItem('zh-dogon4-step',cur)}catch(e){}LASTPOS=[];stopAll();
 $('#app').innerHTML=`<div class="top n"><span class="zh">补课</span><div><h1>Догоняем урок 4</h1><small>Повторение урока 3 + урок 4 · сочетания тонов, 你好, 我叫</small></div>
   <div class="prog">Шаг ${cur} из ${STEPS.length-1}<div class="bar"><i style="width:${cur/(STEPS.length-1)*100}%"></i></div></div></div>
  <div class="main n">${s.h()}
   <div class="nextbar">${cur?'<button class="btn g" id="pv">‹ Назад</button>':''}${cur<STEPS.length-1?`<button class="btn nx" id="nx">${!cur?'Начать →':cur===STEPS.length-2?'Финиш и домашнее задание →':'Дальше: '+STEPS[cur+1].t+' →'}</button>`:''}</div></div>`;
 bind();s.on&&s.on();
 const nx=$('#nx'),pv=$('#pv');nx&&(nx.onclick=()=>{if(!cur&&!ST.name){toast('Сначала выбери, кто ты 🙂');return;}cur++;render();scrollTo({top:0,behavior:'smooth'});});pv&&(pv.onclick=()=>{cur--;render();scrollTo({top:0,behavior:'smooth'});});}
VOKP.finally(()=>{});Promise.race([VOKP,new Promise(r=>setTimeout(r,2500))]).then(()=>{render();preload(['打鼓','可怕','你好','我叫','达莉娅'].map(urlW));});
</script></body></html>

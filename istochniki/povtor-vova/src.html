<style>

 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}

.cards{display:grid;gap:14px;margin-top:16px}@media(min-width:700px){.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c4{grid-template-columns:repeat(4,1fr)}}

 let a=0,e=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(e>a&&Math.abs(d[e])<th)e--;a=Math.max(0,a-Math.round(sr*.015));e=Math.min(d.length,e+Math.round(sr*.06));

async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
// melody of the whole word: pitched frames only, gaps between syllables kept as gaps
function melody(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2;let mx=0;const rms=[];
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.12),f=[];let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=thr?yin(pcm.subarray(i,i+F),sr):[0,1];f.push(v>65&&v<550&&ap<0.2?v:0);}
 for(let i=0;i<f.length;i++){if(!f[i])continue;const nb=[];for(let d=1;d<=5;d++){if(f[i-d])nb.push(f[i-d]);if(f[i+d])nb.push(f[i+d]);}
  if(!nb.length){f[i]=0;continue;}nb.sort((p,q)=>p-q);if(Math.abs(12*Math.log2(f[i]/nb[nb.length>>1]))>5)f[i]=0;}
 let a=f.findIndex(x=>x>0),b=f.length-1;while(b>=0&&!f[b])b--;if(a<0||b-a<8)return null;
 const seg=f.slice(a,b+1),vs=seg.filter(x=>x>0).sort((p,q)=>p-q);if(vs.length<8)return null;const med=vs[vs.length>>1];
 return seg.map(x=>x>0?Math.max(-9,Math.min(9,12*Math.log2(x/med))):null);}
function melSvg(lines){const W=520,H=170,y=v=>H/2-v*(H-30)/18;let out=`<svg class="mel" viewBox="0 0 ${W} ${H}">${[-6,-3,0,3,6].map(v=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE1EA" stroke-width="1"/>`).join('')}`;
 lines.forEach(([m,col,w,dash])=>{if(!m)return;const n=m.length;let d='',pen=false;m.forEach((v,i)=>{if(v===null){pen=false;return;}const x=14+i*(W-28)/(n-1);d+=(pen?'L':'M')+x.toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;});
  out+=`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${dash?'stroke-dasharray="2 9"':''}/>`;});
 return out+'</svg>';}

let LASTPOS=[];

// items: {play:url list or fn, q, opts:[...], right, ok:html, lab:'what was asked'}
function quiz(box,key,title,items,cols){const el=$(box);if(!el)return;LASTPOS=[];
 const N=items.length;const Q=items.map((it,n)=>Object.assign({},it,{n}));let ok=0;const res=[],log=[],miss=[];
 const fin=()=>{ST.res[key]={t:title,ok,of:N,miss};keep();send(key,{t:title,score:ok,of:N,miss,log});gate();
  el.innerHTML=`<div class="qh"><span>${title}</span><span>готово</span></div><div class="res">${ok} / ${N}</div>
   <div class="fb ${ok===N?'ok':''}" style="color:${ok===N?'':'var(--ac2)'}">${ok===N?'Отлично! Всё с первого раза 🎉':ok>=N-1?'Хорошо! Почти всё с первого раза 👍':'Ошибки ты уже исправил 💪 Можно повторить для закрепления — «Ещё раз»'}</div>
   ${miss.length?`<p class="hint2" style="margin-top:6px">Было трудно: ${miss.join(', ')}</p>`:''}
   <div class="row" style="justify-content:center"><button class="btn g" id="${key}-again">↻ Ещё раз</button></div>`;
  $('#'+key+'-again').onclick=()=>quiz(box,key,title,items,cols);};
 const ask=()=>{if(!Q.length)return fin();const it=Q[0];const o=it.fixed?it.opts:arrange(it.opts,it.right);let first=true,lock=false;
  const lab=it.lab||txt(it.right);
  el.innerHTML=`<div class="qh"><span>${title}${it.retry?' · 🔁 ещё раз':''}</span><span>${ok} ✓ · осталось ${Q.length}</span></div>
   <div class="dots">${items.map((_,j)=>`<i class="${res[j]===true?'ok':res[j]===false?'no':j===it.n?'cur':''}"></i>`).join('')}</div>
   ${it.play?'<button class="play n" data-pl aria-label="Послушать">▶</button>':''}<div class="qq">${it.q}</div>
   <div class="opts c${cols||o.length}">${o.map((x,k)=>`<button class="opt n" data-k="${k}">${x}</button>`).join('')}</div><div class="fb"></div>`;
  const pl=el.querySelector('[data-pl]'),fb=el.querySelector('.fb');const go=()=>it.play&&(typeof it.play==='function'?it.play(pl):playList(it.play,pl));
  if(pl){pl.onclick=go;later(go,250);}
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(lock)return;const x=o[+b.dataset.k];
   if(x===it.right){lock=true;b.classList.add('ok');if(first&&!it.retry){ok++;res[it.n]=true;}log.push({q:lab,a:txt(x),ok:1,again:it.retry?1:0});
    fb.className='fb ok';fb.innerHTML='✓ '+(it.ok||'Верно!');Q.shift();later(ask,it.ok?1600:1000);}
   else{log.push({q:lab,a:txt(x),ok:0,again:it.retry?1:0});
    if(first&&!it.retry){res[it.n]=false;miss.push(lab);Q.push(Object.assign({},it,{retry:true}));}
    first=false;b.classList.add('no');fb.className='fb no';fb.innerHTML=(it.trap&&it.trap[x])||('Не совсем'+(it.play?' — послушай ещё раз ▶':'. Попробуй ещё раз!'));if(it.play)go();}});};
 ask();}

const hwOpts=sz=>({width:sz,height:sz,padding:sz*.08,showOutline:true,outlineColor:'#E1E5EE',strokeColor:'#2B3270',radicalColor:'#FF5C8A',drawingColor:'#5B6BD8',drawingWidth:Math.max(6,Math.round(sz/16)),highlightColor:'#2DBE8C',strokeAnimationSpeed:1.2,delayBetweenStrokes:250,charDataLoader:(ch,ok)=>ok(HZDATA[ch])});
// animate a small cell on click
function cellAnim(el,c){if(!window.HanziWriter||!HZDATA[c]){el.innerHTML=`<span class="zh" style="font-size:70px;display:grid;place-items:center;height:100%">${c}</span>`;return null;}
 const w=HanziWriter.create(el,c,Object.assign(hwOpts(el.clientWidth||96),{strokeAnimationSpeed:1.6,delayBetweenStrokes:150}));return w;}
// trace characters one by one; rounds = how many times each is written; cb(mistakes)
function tracer(box,chars,cb,rounds){rounds=rounds||1;const seq=[];for(let r=0;r<rounds;r++)seq.push(...chars);let k=0,mist=0,w=null;
 box.innerHTML=`<div class="wch">${seq.map((c,j)=>`<span class="n" data-j="${j}">${c}</span>`).join('')}</div><div class="wbox">${GRID}<div class="hw" data-hw></div></div>
  <p class="hint2" data-wh style="text-align:center;margin-top:8px"></p><div class="row" style="justify-content:center"><button class="btn g" data-wa>▶ Покажи порядок черт</button><button class="btn g" data-wr>↺ Заново</button></div>`;
 const wh=box.querySelector('[data-wh]');
 const one=()=>{const c=seq[k];const full=k<chars.length;box.querySelectorAll('[data-j]').forEach(s=>{s.classList.toggle('cur',+s.dataset.j===k);s.classList.toggle('ok',+s.dataset.j<k);});
  const el=box.querySelector('[data-hw]');el.innerHTML='';const sz=el.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){wh.textContent='Пропиши '+c+' пальцем в воздухе 🙂';later(()=>{k++;k<seq.length?one():cb(mist);},1500);return;}
  // first round: outline visible; next rounds: no outline, from memory (hint after 3 misses)
  w=HanziWriter.create(el,c,Object.assign(hwOpts(sz),{showCharacter:false,showOutline:full}));
  const quiz=()=>{wh.innerHTML=full?`Обведи <span class="zh" style="font-size:20px">${c}</span> пальцем или мышкой — по порядку черт`:`Теперь <b>по памяти</b>: напиши <span class="zh" style="font-size:20px">${c}</span> без подсказки`;
   w.quiz({showHintAfterMisses:full?2:3,highlightOnComplete:true,onMistake:()=>{mist++;},onComplete:()=>{wh.textContent='✓ Отлично!';later(()=>{k++;if(k<seq.length)one();else{box.querySelectorAll('[data-j]').forEach(s=>{s.classList.remove('cur');s.classList.add('ok');});cb(mist);}},900);}});};
  box.querySelector('[data-wa]').onclick=()=>{w.cancelQuiz();wh.textContent='Смотри порядок черт…';w.showOutline();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();if(!full)w.hideOutline();quiz();},600)});};
  box.querySelector('[data-wr]').onclick=()=>{w.cancelQuiz();quiz();};
  if(full){w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();quiz();},500)});wh.textContent='Смотри порядок черт…';}else quiz();};
 one();}
/* ===================== levels and seals ===================== */
const ensureSid=()=>{ST.sid=ST.sid||('vv'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));keep();};
const LV=[
 {s:'声',t:'Тоны',c:'var(--t2)'},
 {s:'音',t:'Звуки и предыхание',c:'var(--t4)'},
 {s:'好',t:'3 + 3, 3 + 4, 你好 и 我叫',c:'var(--t3)'},
 {s:'拼',t:'Пиньинь с тонами',c:'var(--ac)'},
 {s:'部',t:'Ключи: смысл и звук',c:'#E0533D'},
 {s:'写',t:'Пишем 你 我 好 叫',c:'#8C5BD8'},
 {s:'话',t:'Разговор с 小明',c:'var(--ok)'}];
const BL=i=>`<span class="blk"><b style="background:${LV[i].c}">${LV[i].s}</b> уровень ${i+1} из 7 · ${LV[i].t}</span>`;
const lvDone=i=>STEPS.filter(s=>s.lv===i&&s.need).every(s=>s.need.every(k=>ST.res[k]));
const seals=big=>`<div class="seals${big?' big':''}">${LV.map((l,i)=>`<span class="seal${lvDone(i)?' on':''}" title="Уровень ${i+1}: ${l.t}">${l.s}</span>`).join('')}</div>`;
const needOk=s=>!s.need||isTest()||s.need.every(k=>ST.res[k]);
const nxText=()=>!cur?'Начать →':'Дальше: '+STEPS[cur+1].t+' →';
function gate(){const nx=$('#nx');document.querySelectorAll('.seals').forEach(e=>e.outerHTML=seals(e.classList.contains('big')));if(!nx)return;const s=STEPS[cur];const ok=needOk(s);
 nx.classList.toggle('lock',!ok);nx.classList.toggle('okb',ok&&!!s.need);nx.textContent=ok?nxText():'🔒 Сначала выполни задание на этом шаге';}

/* ===================== checks without sound (every click goes to the teacher) ===================== */
function chk(q,opts,c,ex,two){const order=arrange(opts.map((o,i)=>i),c);
 return `<div class="chk in" data-c="${c}" data-q="${encodeURIComponent(txt(q))}"><div class="q">${q}</div><div class="mcq ${two?'two':''}">${order.map(i=>`<button class="opt n" data-i="${i}">${opts[i]}</button>`).join('')}</div><div class="fb" data-ex="${encodeURIComponent(ex||'')}"></div></div>`;}
function bind(){document.querySelectorAll('.chk').forEach(box=>{const c=+box.dataset.c,fb=box.querySelector('.fb');let done=false;const q=decodeURIComponent(box.dataset.q);
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;const good=+b.dataset.i===c;
  ST.chk=ST.chk||{};const r=ST.chk[q]||(ST.chk[q]={step:STEPS[cur].t,a:[]});if(r.a.length<6)r.a.push({a:txt(b.innerHTML),ok:good?1:0});keep();if(good)send('chk',{items:ST.chk});
  if(good){done=true;b.classList.add('ok');fb.className='fb ok';fb.innerHTML='✓ Верно! '+decodeURIComponent(fb.dataset.ex);}
  else{b.classList.add('no');fb.className='fb no';fb.textContent='Не совсем — попробуй ещё раз. 犯错不可怕!';}});});
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>playW(b.dataset.w,b));
 document.querySelectorAll('[data-hz]').forEach(b=>b.onclick=()=>playHz(b.dataset.hz,b));
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>playS(b.dataset.s,b));
 document.querySelectorAll('[data-k0]').forEach(b=>b.onclick=()=>{const u=urlK(b.dataset.k0+'0');u?playList([u],b):playS(b.dataset.alt,b);});}

/* ===================== 🐉 dragon game: hear the syllable, tap the tone (or the initial) ===================== */
const DRG=`<div class="dr"><img src="../urok-6/zadaniya/img/dragon.png" alt="" onerror="this.replaceWith(document.createTextNode('🐉'))"></div>`;
const FD=inner=>`<div class="fd" id="dg"><div class="wall"></div>${DRG}<div class="fire"></div>${inner}</div>`;
const has=s=>!!urlS(s);
function dragon(box,key,mode){const el=$(box);if(!el)return;const R=12;const TONE=mode==='tone';
 const title=TONE?'Огненный дракон: тоны':'Огненный дракон: b p d t g k';
 const pool=[];
 if(TONE)['ba','pa','ma','fa','da','ta','na','la','ga','ka','ha','bi','pi','mi','di','ti','ni','li','bu','pu','fu','du','tu','nu','lu','gu','ku','hu','mo','bo','po','de','te','ge','ke','he'].forEach(b=>[1,2,3,4].forEach(t=>{const s=mark(b,t);if(has(s))pool.push(s);}));
 else ['b','p','d','t','g','k'].forEach(i=>['a','i','u','e','o'].forEach(f=>[1,2,3,4].forEach(t=>{const s=mark(i+f,t);if(has(s))pool.push(s);})));
 const ans=s=>TONE?String(SYL.tone(s)):SYL.plain(s)[0];
 const BTN=TONE?['1','2','3','4']:['b','p','d','t','g','k'];
 const bl=x=>TONE?`${curve([+x],70,46)}<small>${x}-й тон</small>`:x;
 const why=s=>TONE?`${s} — ${SYL.tone(s)}-й тон`:`${s} — ${'ptk'.includes(s[0])?'предыхательный 💨':'непредыхательный'}`;
 const intro=()=>{el.innerHTML=`<div class="gst"><h3>Защити крепость!</h3><p>Летят волшебные звуковые шары. Слушай слог и жми ${TONE?'<b>его тон</b>':'<b>первый звук</b>: b p d t g k'}.</p><p>Угадал — дракон сжигает шар 🔥. Ошибся или не успел — шар бьёт по стене.</p><p>🔥 3 подряд — комбо ×2 · 🏮 3 фонарика-жизни · ${R} волн</p></div>
  <div class="row" style="justify-content:center"><button class="btn" id="${key}-st" style="font-size:20px;padding:18px 34px">🔥 В бой!</button></div>`;$('#'+key+'-st').onclick=play;};
 function play(){let i=0,pts=0,hits=0,cmb=0,lives=3;const miss=[],log=[];let prev='',prevA='';
  const pick=()=>{let x,k=0;do{x=pool[Math.random()*pool.length|0];k++;}while((x===prev||ans(x)===prevA)&&k<60);prev=x;prevA=ans(x);return x;};
  const round=()=>{if(i>=R||lives<=0)return end();const s=pick(),a=ans(s);let lock=false;i++;const spd=Math.max(5,8.5-i*.25);
   el.innerHTML=`<div class="hud"><span>⭐ ${pts}</span><span class="cmb">${cmb>=3?'🔥 ×2':''}</span><span>${'🏮'.repeat(lives)}${'▫️'.repeat(3-lives)}</span></div>
    <div class="dots">${Array.from({length:R},(_,j)=>`<i class="${j<i-1?'ok':j===i-1?'cur':''}"></i>`).join('')}</div>
    ${FD(`<div class="orb" id="orb" style="--t:${spd}s">?</div><div class="tag" id="ds">Волна ${i} из ${R}</div>`)}
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn g" id="rp">🔊 Ещё раз</button></div>
    <div class="zk ${TONE?'c4 tn':''}">${BTN.map(x=>`<button class="opt" data-i="${x}">${bl(x)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   const rp=$('#rp');rp.onclick=()=>playS(s,rp);later(()=>playS(s,rp),250);
   const dg=$('#dg'),orb=$('#orb');
   const answer=b=>{if(lock)return;lock=true;const got=b?b.dataset.i:'—',good=got===a,fb=$('#fb');orb.textContent=s;$('#ds').textContent=s;log.push({q:s,a:got,ok:good?1:0});
    if(good){hits++;cmb++;pts+=cmb>=3?2:1;b.classList.add('ok');const o=orb.getBoundingClientRect(),f=dg.querySelector('.fire').getBoundingClientRect();dg.style.setProperty('--fx',(o.left-f.left+20)+'px');dg.style.setProperty('--fy',(o.top-f.top+20)+'px');dg.classList.add('hit');fb.className='fb ok';fb.textContent=cmb>=3?'🔥 Огненное комбо ×2!':'🔥 Шар сгорел! '+why(s);}
    else{cmb=0;lives--;miss.push(s);if(b)b.classList.add('no');const r=el.querySelector(`[data-i="${a}"]`);r&&r.classList.add('ok');dg.classList.add('miss');fb.className='fb no';fb.textContent=(b?'':'Не успел! ')+'Это был '+why(s)+'.';playS(s);}
    later(round,good?1300:2900);};
   orb.addEventListener('animationend',e=>{if(e.animationName==='fall')answer(null);});
   el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(b));};
  round();
  function end(){const full=lives>0;const u=[...new Set(miss)];ST.res[key]={t:title,ok:hits,of:i,miss:u};keep();send(key,{t:title,score:hits,of:i,pts,miss:u,log});gate();
   el.innerHTML=`${FD(`<div class="tag">${full?'Крепость спасена! 🏯':'Дракон устал 😴'}</div>`)}<div class="res" style="text-align:center">⭐ ${pts}</div>
    <p class="lead" style="text-align:center">${full?'Крепость спасена!':'Крепость устояла не до конца.'} Угадано ${hits} из ${i}.${u.length?' Можно повторить для закрепления: <span class="py">'+u.join(', ')+'</span>':''}</p>
    <div class="row" style="justify-content:center"><button class="btn g" id="${key}-again">↻ Ещё раз</button></div>`;$('#'+key+'-again').onclick=play;}}
 intro();}

/* ===================== write pinyin with tones ===================== */
const PYL=[{hz:'你好！',ru:'Привет!',want:['nǐ','hǎo']},{hz:'我叫小明。',ru:'Меня зовут Сяо Мин.',want:['wǒ','jiào','xiǎo','míng']},{hz:'好！',ru:'Хорошо!',want:['hǎo']},{hz:'我叫'+ME.hz+'。',ru:'Меня зовут Владимир.',want:['wǒ','jiào'],name:'fulajimier'}];
const pl=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const NUM=s=>s.replace(/([a-zü]+)([1-4])/gi,(m,b,t)=>mark(b.toLowerCase(),+t));
const TN=s=>{const t=[1,2,3,4].find(k=>TMARK[k].test(s));return t||0;};
function chkPy(L,inp){const s=NUM(inp).normalize('NFC').toLowerCase().replace(/[^a-zāáǎàōóǒòēéěèīíǐìūúǔùü]/g,'');
 const want=L.want.join(''),head=L.name?s.slice(0,want.length):s,rest=L.name?s.slice(want.length):'';
 if(!s)return {ok:false,msg:'Строчка пустая'};
 if(pl(head)!==pl(want)){
  if(L.want[1]==='jiào'&&/^wohao/.test(pl(s)))return {ok:false,msg:'«Меня зовут» — это <b>wǒ jiào</b> 我叫. А <b>hǎo</b> 好 — «хорошо»'};
  if(L.want[0]==='nǐ'&&/jiao/.test(pl(s)))return {ok:false,msg:'«Привет» — это 你好: <b>hǎo</b>, а не jiào'};
  return {ok:false,msg:'Проверь буквы. Нажми 🔊 и послушай ещё раз',letters:1};}
 let p=0;for(const syl of L.want){const got=head.slice(p,p+syl.length);p+=syl.length;
  if(got!==syl){const t=TN(syl);return {ok:false,msg:TN(got)?`Тон в <b>${got}</b> другой: здесь ${t}-й тон`:`Поставь тон на <b>${pl(syl)}</b> (здесь ${t}-й тон)`};}}
 if(L.name&&pl(rest)!==L.name)return {ok:false,msg:rest?'Проверь имя: Fúlājīmǐ\'ěr (тоны в имени можно не ставить)':'А имя? После wǒ jiào напиши своё имя: Fulajimier'};
 return {ok:true,msg:'✓ Верно! '+L.want.join(' ')+(L.name?' Fúlājīmǐ\'ěr':'')};}
function pyTask(box){const el=$(box);const st=ST.pyd=ST.pyd||{first:{},log:[],good:{}};
 el.innerHTML=`<div class="pyl">${PYL.map((L,i)=>`<div class="card n${st.good[i]?' done':''}" id="pc${i}"><div class="hd"><button class="btn g" style="padding:8px 12px" data-pz="${L.hz.replace(/[！。]/g,'')}">🔊</button><span class="zh">${L.hz}</span><small>${L.ru}</small></div>
  <input class="in" id="pi${i}" placeholder="${L.name?'wǒ jiào + твоё имя':'пиньинь с тонами'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${st.good[i]?L.want.join(' ')+(L.name?' Fúlājīmǐ\'ěr':''):''}"><div class="pv" id="pv${i}">${st.good[i]?'✓ Готово':''}</div></div>`).join('')}</div>
  <div class="tkeys">${['ā','á','ǎ','à','ō','ó','ǒ','ò','ē','é','ě','è','ī','í','ǐ','ì','ū','ú','ǔ','ù'].map(x=>`<button class="n" data-tk="${x}">${x}</button>`).join('')}</div>
  <p class="hint2" style="text-align:center;margin-top:8px">Тон можно ставить кнопкой выше или цифрой: <b>ni3</b> → <b>nǐ</b></p>
  <div class="row" style="justify-content:center"><button class="btn" id="pchk">✓ Проверить</button></div><div class="fb" id="pfb" style="text-align:center"></div>`;
 el.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>playHz(b.dataset.pz,b));
 let last=$('#pi0');PYL.forEach((_,i)=>{const e=$('#pi'+i);e.onfocus=()=>last=e;e.oninput=()=>{const n=NUM(e.value);if(n!==e.value){const p=e.selectionStart-(e.value.length-n.length);e.value=n;try{e.selectionStart=e.selectionEnd=p;}catch(x){}}};});
 el.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{const e=last,p=e.selectionStart??e.value.length;e.value=e.value.slice(0,p)+b.dataset.tk+e.value.slice(e.selectionEnd??p);e.focus();e.selectionStart=e.selectionEnd=p+1;});
 $('#pchk').onclick=()=>{let n=0;PYL.forEach((L,i)=>{const v=$('#pi'+i).value.trim();const r=chkPy(L,v);if(r.ok)n++;
   if(!st.good[i]){if(st.first[i]==null&&v)st.first[i]=r.ok?1:0;if(v&&st.log.length<60)st.log.push({line:L.hz,text:v,ok:r.ok?1:0});
    st.fails=st.fails||{};if(!r.ok&&v)st.fails[i]=(st.fails[i]||0)+1;}
   if(r.ok)st.good[i]=1;
   const pv=$('#pv'+i);pv.className='pv '+(r.ok?'ok':'no');pv.innerHTML=r.msg+(!r.ok&&st.fails&&st.fails[i]>=2?` <span style="color:var(--mu)">· образец: ${L.want.join(' ')}${L.name?' Fulajimier':''}</span>`:'');$('#pc'+i).classList.toggle('done',r.ok);});
  keep();const fb=$('#pfb');
  if(n===PYL.length){const first=PYL.filter((_,i)=>st.first[i]===1).length;ST.res.py={t:'Пиньинь с тонами',ok:first,of:PYL.length};keep();
   send('py',{t:'Пиньинь с тонами',score:first,of:PYL.length,log:st.log,miss:PYL.filter((_,i)=>st.first[i]!==1).map(L=>L.hz)});gate();
   fb.className='fb ok';fb.innerHTML='🎉 Все строчки верные, тоны на месте!';}
  else{fb.className='fb no';fb.innerHTML=`Верно ${n} из ${PYL.length}. Поправь строчки с подсказками и нажми «Проверить» ещё раз.`;}};}

/* ===================== write from memory: 你 我 好 叫 ===================== */
const HZI={你:['nǐ','ты'],我:['wǒ','я'],好:['hǎo','хорошо'],叫:['jiào','зваться, меня зовут']};
function memoBox(el,chars,cb){let k=0,w=null,cur2=0;const res=[];
 const one=()=>{const c=chars[k],[py,ru]=HZI[c];let hints=0,show=0,mist=0;cur2=0;
  el.innerHTML=`<div class="wch">${chars.map((x,j)=>`<span class="n${j<k?' ok':j===k?' cur':''}">${j<k?x:'?'}</span>`).join('')}</div>
   <div class="qcard in"><div class="qhead"><span>Иероглиф ${k+1} из ${chars.length}</span><span>💡 подсказок: <b id="hc">0</b></span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px"><button class="play n" id="mpl" style="width:58px;height:58px;font-size:22px;margin:0">🔊</button><div style="text-align:left"><div class="py" style="font-size:26px;color:${TCOL[TN(py)]}">${py}</div><div style="font-weight:800;font-size:18px;color:var(--ink)">«${ru}»</div></div></div></div>
   <div class="wbox">${GRID}<div class="hw" id="mhw"></div></div>
   <p class="hint2" id="mwh" style="text-align:center;margin-top:8px">Напиши этот иероглиф по памяти. Не помнишь — бери подсказку 👇</p>
   <div class="row" style="justify-content:center;gap:8px"><button class="btn g" id="mh1">👉 Следующая черта</button><button class="btn g" id="mh2">💡 Контур</button><button class="btn g" id="mh3">👀 Покажи весь</button></div>`;
  const mpl=$('#mpl');mpl.onclick=()=>playHz(c,mpl);
  const hw=$('#mhw');const sz=hw.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){$('#mwh').textContent='Напиши '+c+' пальцем в воздухе 🙂';res.push({c,hints,show:1,mist});later(next,1500);return;}
  w=HanziWriter.create(hw,c,Object.assign(hwOpts(sz),{showOutline:false,showCharacter:false}));
  const hc=()=>{$('#hc').textContent=hints+show;};
  const q=()=>w.quiz({showHintAfterMisses:3,highlightOnComplete:true,onMistake:()=>{mist++;if(mist===3)$('#mwh').textContent='Ничего страшного! Нужная черта мигнёт зелёным — повтори её 🙂';},
   onCorrectStroke:d=>{cur2=d.strokeNum+1;$('#mwh').textContent='Так держать! ✓';},
   onComplete:()=>{res.push({c,hints,show,mist});$('#mwh').textContent=hints+show===0?'🏆 Без подсказок — супер!':'✓ Написано!';later(next,1200);}});
  $('#mh1').onclick=()=>{hints++;hc();try{w.highlightStroke(cur2);}catch(e){}};
  $('#mh2').onclick=()=>{hints++;hc();w.showOutline();later(()=>w.hideOutline(),2500);};
  $('#mh3').onclick=()=>{show++;hc();w.cancelQuiz();cur2=0;$('#mwh').textContent='Смотри внимательно…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();$('#mwh').textContent='А теперь ты — по памяти!';q();},700)});};
  q();};

/* ===================== 小明: scripted dialog, the kid speaks into the mic ===================== */
let stream=null;
async function getMicXM(){if(stream&&stream.active)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});return stream;}
function wav16(f32,sr){const n=f32.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}return new Blob([buf],{type:'audio/wav'});}
async function toWav(blob){const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const src=await ac.decodeAudioData(await blob.arrayBuffer());ac.close&&ac.close();
 const len=Math.ceil(src.duration*16000);const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const oc=new OAC(1,len,16000);const b=oc.createBufferSource();b.buffer=src;b.connect(oc.destination);b.start();return wav16((await oc.startRendering()).getChannelData(0),16000);}
function talkBtn(btn,onAudio,onFail){let rec=null,chunks=[],t0=0,toggle=false,raf=0,ac=null;
 async function start(){stopAll();try{await getMicXM();}catch(e){onFail();return false;}
  chunks=[];const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  try{rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);}catch(e){onFail();return false;}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();t0=performance.now();btn.classList.add('rec');btn.textContent='⏹';
  try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);const d=new Uint8Array(an.fftSize);
   const loop=()=>{an.getByteTimeDomainData(d);let s=0;for(const x of d){const y=(x-128)/128;s+=y*y;}btn.style.setProperty('--lvl',(1+Math.min(.3,Math.sqrt(s/d.length)*2.5)).toFixed(3));raf=requestAnimationFrame(loop);};loop();}catch(e){}
  return true;}
 function stop(){if(!rec)return;const r=rec;rec=null;btn.classList.remove('rec');btn.textContent='🎤';cancelAnimationFrame(raf);btn.style.removeProperty('--lvl');if(ac){ac.close();ac=null;}const dur=performance.now()-t0;
  r.onstop=async()=>{if(dur<500){toast('Слишком коротко. Скажи фразу целиком.');return;}btn.classList.add('busy');
   try{const raw=new Blob(chunks,{type:r.mimeType});await onAudio(await toWav(raw),raw);}catch(e){toast('Не расслышал. Попробуй ещё раз, чуть громче.');}finally{btn.classList.remove('busy');}};r.stop();}
 btn.addEventListener('pointerdown',async e=>{e.preventDefault();if(btn.classList.contains('busy'))return;if(rec&&toggle){toggle=false;stop();return;}const ok=await start();if(!ok)return;
  const up=()=>{btn.removeEventListener('pointerup',up);btn.removeEventListener('pointercancel',up);if(performance.now()-t0<400)toggle=true;else stop();};btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);});}
const clean=t=>String(t||'').replace(/[,]/g,'，').replace(/[?]/g,'？').replace(/[!]/g,'！').replace(/[.]/g,'。').replace(/[^㐀-鿿，。？！、]/g,'').trim();
async function stt(wav){const r=await fetch(II+'/stt',{method:'POST',headers:{'Content-Type':'audio/wav'},body:wav});const j=await r.json();if(j.error)throw new Error(j.error);return clean(j.text);}
function xiaoming(){const me=ME;
 const XS=[{xm:'你好！',py:'nǐ hǎo!',ru:'Привет!'},{me:'hi',zh:'你好！',py:'nǐ hǎo!',ru:'Привет!'},
  {xm:'我叫小明。',py:'wǒ jiào Xiǎo Míng.',ru:'Меня зовут Сяо Мин.'},{xm:'你叫什么名字？',py:'nǐ jiào shénme míngzi?',ru:'Как тебя зовут?',nw:1},
  {me:'name',zh:'我叫'+me.hz+'。',py:'wǒ jiào '+me.py.join(' ')+'.',ru:'Меня зовут Владимир.'},{xm:'好！',py:'hǎo!',ru:'Хорошо!'}];
 let k=0,ok=0,log=[],notes=[],noMic=false;$('#xc').innerHTML='';
 const line=(who,st,extra)=>{const d=document.createElement('div');d.className='ln'+(who==='me'?' me':'');
  d.innerHTML=(who==='me'?'<span class="av me">В</span>':`<img class="av" src="${IMG}xiaoming.jpg" alt="小明">`)+`<div class="bb">${st.nw?'<span class="nw">✨ новая фраза</span><br>':''}<span class="zh">${st.zh||st.xm}</span>${st.py?`<span class="py">${st.py}</span>`:''}${st.ru?`<small>${st.ru}</small>`:''}${extra||''}</div>`;
  $('#xc').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d;};
 const next=async()=>{if(!$('#xc'))return;if(k>=XS.length)return end();const st=XS[k];
  if(st.xm){const d=line('xm',st,' <button class="btn g" style="padding:4px 10px;font-size:13px;margin-top:6px">🔊</button>');log.push({who:'xm',text:st.xm});d.querySelector('button').onclick=()=>xmSay(st.xm);
   $('#ctl').innerHTML='<p class="hint2" style="text-align:center;margin-top:14px">小明 говорит…</p>';await xmSay(st.xm);await new Promise(r=>later(r,st.nw?900:450));if(!$('#xc'))return;k++;return next();}
  turn(st,0);};
 const turn=(st,tries)=>{const say1=st.zh;
  $('#ctl').innerHTML=`<div class="qbox in"><div class="hint2">Твоя очередь! Скажи:</div><div class="zh" style="font-size:34px;color:var(--ac2);margin-top:4px">${say1}</div><div class="py" style="color:var(--ac)">${st.py}</div><small style="font-weight:700;color:var(--mu)">${st.ru}</small>
   ${noMic?'':'<button class="mic" id="mic" aria-label="Говорить">🎤</button><div class="hint2">Нажми 🎤 и говори, потом ⏹</div>'}<div class="fb" id="xf"></div>
   <div class="row" style="justify-content:center"><button class="btn g" id="hl">🔊 Как сказать</button>${noMic||tries>=2?`<button class="btn" id="tp">${noMic?'Сказал вслух ✓':'Дальше →'}</button>`:''}</div></div>`;
  $('#hl').onclick=()=>playHz(say1.replace(/[！。]/g,''));
  const goOn=(text,good,note)=>{if(good)ok++;if(note)notes.push(note);log.push({who:'me',text:text||'—',ok:good});line('me',{zh:text||say1,py:'',ru:good?'✓':''});k++;later(next,500);};
  const tp=$('#tp');if(tp)tp.onclick=()=>goOn(noMic?say1:'',noMic,noMic?'без микрофона: '+(st.me==='hi'?'приветствие':'представился')+' вслух':'не распознано: '+say1);
  const mic=$('#mic');if(!mic)return;
  talkBtn(mic,async(wav,raw)=>{upAud('xm'+(st.me==='hi'?1:2),raw);let t='';try{t=await stt(wav);}catch(e){toast('Распознавание не ответило. Попробуй ещё раз.');return;}
   const fb=$('#xf');if(!t){fb.className='fb no';fb.textContent='Не расслышал. Скажи чуть громче 🙂';if(tries>=1)turn(st,tries+1);return;}
   if(st.me==='hi'){const good=/好/.test(t)&&/[你您尼泥妳]/.test(t);if(good)return goOn(t,true);
    fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. ${/好/.test(t)?'Начни с 你 nǐ.':'Скажи 你好 — nǐ hǎo.'} Попробуй ещё раз!`;notes.push('привет: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);return;}
   const jiao=/叫/.test(t),hit=[...me.hz].filter(c=>t.includes(c)).length;
   if(jiao){if(hit<Math.ceil(me.hz.length/2))notes.push('имя распознано как «'+t+'»');return goOn(t,true);}
   fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. Начни с <b>我叫</b> wǒ jiào — «меня зовут». Попробуй ещё раз!`;notes.push('имя: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);},
  ()=>{noMic=true;toast('Микрофон недоступен — скажи вслух и нажми кнопку');turn(st,tries);});};
 const end=()=>{ST.res.xm={t:'Разговор с 小明',ok,of:2};keep();send('xm',{t:'Разговор с 小明',score:ok,of:2,log,notes});
  $('#ctl').innerHTML=`<div class="qbox in"><div style="font-size:54px">🎉</div><div class="res" style="font-size:30px">Вы познакомились!</div><p class="lead">${ok===2?'小明 понял тебя с первого раза. 好！':'Молодец! В следующий раз скажи ещё чётче.'}</p>
   <div class="row" style="justify-content:center"><button class="btn g" id="again">↺ Ещё раз</button></div></div>`;$('#again').onclick=xiaoming;};
 next();}

/* ===================== shell ===================== */
let cur=0;try{cur=Math.min(STEPS.length-1,+localStorage.getItem('zh-pv-vova-step')||0);}catch(e){}
if(/[?&]uchitel/.test(location.search)){ST.name='учитель';ST.res._who={t:'',ok:1,of:1};}
// a step can be opened only when every step before it is done (no skipping ahead)
const firstOpen=()=>{for(let i=0;i<STEPS.length;i++)if(!needOk(STEPS[i]))return i;return STEPS.length-1;};
if(!isTest())cur=Math.min(cur,firstOpen());
function render(){const s=STEPS[cur];try{localStorage.setItem('zh-pv-vova-step',cur)}catch(e){}LASTPOS=[];stopAll();TM.forEach(clearTimeout);TM=[];try{speechSynthesis.cancel()}catch(e){}
 const N=STEPS.length-1;
 $('#app').innerHTML=`<div class="top n"><span class="zh">复习</span><div><h1>Большое повторение</h1><small>Уроки 1–5 · 7 уровней · для Володи</small></div>
   <div class="prog">Шаг ${cur} из ${N}<div class="bar"><i style="width:${cur/N*100}%"></i></div></div>${cur?seals():''}</div>
  <div class="main n">${s.h()}
   <div class="nextbar">${cur?'<button class="btn g" id="pv">‹ Назад</button>':''}${cur<N?`<button class="btn nx" id="nx"></button>`:''}</div></div>`;
 bind();s.on&&s.on();gate();if(cur&&ST.name&&!isTest())markStep();
 const nx=$('#nx'),pv=$('#pv');
 nx&&(nx.onclick=()=>{if(!needOk(STEPS[cur])){toast(cur?'Сначала выполни задание на этом шаге 🙂':'Сначала нажми, кто проходит 🙂');const t=document.querySelector('.qbox,#g1,#g2,#py,#mb,#tr,.rec,#ctl');t&&t.scrollIntoView({behavior:'smooth',block:'center'});return;}cur++;render();scrollTo({top:0,behavior:'smooth'});});
 pv&&(pv.onclick=()=>{cur--;render();scrollTo({top:0,behavior:'smooth'});});}
Promise.race([VOKP,new Promise(r=>setTimeout(r,2500))]).then(()=>{render();flush();preload(['你好','我叫'].map(urlW));});
</script></body></html>

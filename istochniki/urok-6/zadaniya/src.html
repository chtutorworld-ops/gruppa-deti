function tracer(box,chars,cb){let k=0,mist=0,w=null;
 box.innerHTML=`<div class="wch">${[...chars].map((c,j)=>`<span class="n" data-j="${j}">${c}</span>`).join('')}</div><div class="wbox">${GRID}<div class="hw" id="hw"></div></div>

 const one=()=>{const c=chars[k];box.querySelectorAll('[data-j]').forEach(s=>{s.classList.toggle('cur',+s.dataset.j===k);s.classList.toggle('ok',+s.dataset.j<k);});

  if(!window.HanziWriter||!HZDATA[c]){$('#wh').textContent='Пропиши '+c+' пальцем в воздухе 🙂';later(()=>{k++;k<chars.length?one():cb(mist);},1500);return;}
  w=HanziWriter.create(el,c,hwOpts(sz));
  const quiz=()=>{$('#wh').innerHTML=`Обведи <span class="zh" style="font-size:20px">${c}</span> пальцем — по порядку черт`;w.quiz({showHintAfterMisses:2,highlightOnComplete:true,onMistake:()=>{mist++;},onComplete:()=>{$('#wh').textContent='✓ Отлично!';later(()=>{k++;if(k<chars.length)one();else{box.querySelectorAll('[data-j]').forEach(s=>{s.classList.remove('cur');s.classList.add('ok');});cb(mist);}},1100);}});};
  $('#wa').onclick=()=>{w.cancelQuiz();$('#wh').textContent='Смотри порядок черт…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();quiz();},600)});};
  $('#wr').onclick=()=>{w.cancelQuiz();quiz();};
  w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();quiz();},500)});$('#wh').textContent='Смотри порядок черт…';};
 one();}

/* ---- writing from memory with hints (2, and the end of 8) ---- */
function memoBox(box,chars,cb){let k=0,w=null,cur=0,res=[];
 const one=()=>{const c=chars[k],[py,ru]=HZI[c]||['',''];let hints=0,show=0,mist=0;cur=0;
  box.innerHTML=`<div class="wch">${[...chars].map((x,j)=>`<span class="n${j<k?' ok':j===k?' cur':''}">${j<k?x:'?'}</span>`).join('')}</div>
   <div class="qcard in" style="padding:12px;margin-top:12px"><div class="qhead"><span>Иероглиф ${k+1} из ${chars.length}</span><span>💡 ${'<b id="hc">0</b>'}</span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px"><button class="play n" id="pl" style="width:58px;height:58px;font-size:22px;margin:0">🔊</button><div style="text-align:left"><div class="py" style="font-size:26px;color:${TCOL[toneOf(py)]}">${py}</div><div style="font-weight:800;font-size:18px;color:var(--ink)">«${ru}»</div></div></div></div>
   <div class="wbox">${GRID}<div class="hw" id="hw"></div></div>
   <p class="hint2" id="wh" style="text-align:center;margin-top:8px">Напиши этот иероглиф по памяти. Не помнишь — бери подсказку 👇</p>
   <div class="row" style="justify-content:center;gap:8px"><button class="btn g" id="h1">👉 Следующая черта</button><button class="btn g" id="h2">💡 Контур</button><button class="btn g" id="h3">👀 Покажи весь</button></div>`;
  const pl=$('#pl');pl.onclick=()=>playW(c,pl);
  const el=box.querySelector('#hw');const sz=el.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){$('#wh').textContent='Напиши '+c+' пальцем в воздухе 🙂';later(next,1500);return;}
  w=HanziWriter.create(el,c,hwOpts(sz,{showOutline:false}));
  const hc=()=>{$('#hc').textContent=hints+show;};
  const quiz=()=>w.quiz({showHintAfterMisses:3,highlightOnComplete:true,onMistake:()=>{mist++;if(mist===3)$('#wh').textContent='Ничего страшного! Нужная черта мигнёт зелёным — повтори её 🙂';},
   onCorrectStroke:d=>{cur=d.strokeNum+1;$('#wh').textContent='Так держать! ✓';},
   onComplete:()=>{res.push({c,hints,show,mist});$('#wh').textContent=hints+show===0?'🏆 Без подсказок — супер!':'✓ Написано!';box.querySelectorAll('.wch span')[k].classList.add('ok');later(next,1200);}});
  $('#h1').onclick=()=>{hints++;hc();try{w.highlightStroke(cur);}catch(e){}};
  $('#h2').onclick=()=>{hints++;hc();w.showOutline();later(()=>w.hideOutline(),2500);};
  $('#h3').onclick=()=>{show++;hc();w.cancelQuiz();cur=0;$('#wh').textContent='Смотри внимательно…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();$('#wh').textContent='А теперь ты — по памяти!';quiz();},700)});};
  quiz();};
 const next=()=>{k++;if(k<chars.length)one();else cb(res);};
 one();}

/* ---- 3. aspiration: read the syllable (no sound) — with a puff or without ---- */
const ASPQ=[['pà',1],['bō',0],['tǔ',1],['dé',0],['dì',0],['kǎ',1],['gē',0],['pí',1],['kù',1],['bù',0],['tè',1],['gǔ',0]];
const ASPW={p:'p — предыхательный: листок у рта шевелится 💨',t:'t — предыхательный 💨',k:'k — предыхательный 💨',b:'b — непредыхательный, мягко',d:'d — непредыхательный',g:'g — непредыхательный'};
function aspir(){const n=3;let i=0,ok=0,res=[];
 const ask=()=>{if(i>=ASPQ.length){finish(n,ok,ASPQ.length,{miss:ASPQ.filter((x,j)=>!res[j]).map(x=>x[0])});
   shell(doneBox(n,`<div class="res">💨 ${ok} / ${ASPQ.length}</div><div class="ans" style="grid-template-columns:repeat(4,1fr)">${ASPQ.map((x,j)=>`<span class="${res[j]?'ok':'no'}">${x[0]} ${x[1]?'💨':''}</span>`).join('')}</div>
    <div class="tip">Запомни: <b>p t k</b> — предыхательные 💨, <b>b d g</b> — непредыхательные. Сегодня узнаем ещё две предыхательные!</div>`,true));$('#again').onclick=aspir;return;}
  const [s,a]=ASPQ[i];let lock=false;
  shell(`${backBtn}${tag(n)}<h2>💨 Предыхательный или нет?</h2><p class="lead">Прочитай слог про себя (или шёпотом с ладонью у рта). Есть придыхание — сильный поток воздуха?</p>
   <div class="qcard in"><div class="qhead"><span>Слог ${i+1} из ${ASPQ.length}</span><span>${ok} ✓</span></div>
   <div class="dots">${ASPQ.map((_,j)=>`<i class="${j<i?(res[j]?'ok':'no'):j===i?'cur':''}"></i>`).join('')}</div>
   <div style="font:900 84px Nunito;color:var(--ac2);margin:14px 0 4px">${s}</div>
   <div class="opts"><button class="opt" data-a="1" style="font-size:22px">💨<br>предыхательный</button><button class="opt" data-a="0" style="font-size:22px">🙂<br>непредыхательный</button></div><div class="fb" id="fb"></div></div>`);
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const good=+b.dataset.a===a,fb=$('#fb');res[i]=good;if(good)ok++;
   b.classList.add(good?'ok':'no');if(!good)document.querySelector(`[data-a="${a}"]`).classList.add('ok');
   fb.className='fb '+(good?'ok':'no');fb.textContent=(good?'✓ Верно! ':'Не совсем: ')+ASPW[s[0]];later(()=>{i++;ask();},good?1100:2300);});};
 ask();}

function quizRun(n,title,lead,Q,cb){let i=0,ok=0,res=[],h=[];const items=Q.map(([q,o,why])=>{const [a,ix]=arrange(o,o[0],h);h=h.concat(ix);return {q,o:a,r:o[0],why};});
 const ask=()=>{if(i>=items.length)return cb(ok,items,res);const it=items[i];let lock=false;
  shell(`${backBtn}${tag(n)}<h2>${title}</h2>${i===0&&lead?`<p class="lead">${lead}</p>`:''}<div class="qcard in"><div class="qhead"><span>Вопрос ${i+1} из ${items.length}</span><span>${ok} ✓</span></div>
   <div class="dots">${items.map((_,j)=>`<i class="${j<i?(res[j]?'ok':'no'):j===i?'cur':''}"></i>`).join('')}</div>
   <div style="font-size:21px;font-weight:800;color:var(--ink);line-height:1.35;margin:12px 0">${it.q}</div>
   <div class="list" style="margin-top:6px">${it.o.map(x=>`<button class="opt" data-o="${esc(x)}" style="font:800 17px Manrope;padding:14px 16px;text-align:left">${x}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`);
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const good=b.dataset.o===esc(it.r);res[i]=good;if(good)ok++;b.classList.add(good?'ok':'no');
   if(!good)document.querySelectorAll('[data-o]').forEach(x=>{if(x.dataset.o===esc(it.r))x.classList.add('ok');});
   const fb=$('#fb');fb.className='fb '+(good?'ok':'no');fb.textContent=(good?'✓ Верно! ':'Правильный ответ отмечен зелёным. ')+it.why;later(()=>{i++;ask();},good?1500:2800);});};
 ask();}

   const answer=(b)=>{if(lock)return;lock=true;const good=!!b&&b.dataset.i===ini,fb=$('#fb');orb.textContent=s;$('#ds').textContent=s;
    if(good){hits++;cmb++;pts+=cmb>=3?2:1;b.classList.add('ok');const o=orb.getBoundingClientRect(),f=dg.querySelector('.fire').getBoundingClientRect();dg.style.setProperty('--fx',(o.left-f.left+20)+'px');dg.style.setProperty('--fy',(o.top-f.top+20)+'px');dg.classList.add('hit');fb.className='fb ok';fb.textContent=cmb>=3?'🔥 Огненное комбо ×2!':'🔥 Шар сгорел!';}
    else{cmb=0;lives--;miss.push(s);if(b)b.classList.add('no');document.querySelector(`[data-i="${ini}"]`).classList.add('ok');dg.classList.add('miss');fb.className='fb no';fb.textContent=(b?'':'Не успел! ')+'Это был '+s+'. '+ZW[ini];playS(s);}
    later(round,good?1100:2700);};
   orb.addEventListener('animationend',e=>{if(e.animationName==='fall')answer(null);});
   document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(b));};
  round();
  function end(){const full=lives>0;const rec=pts>best;if(rec)try{localStorage.setItem('zh-u6-best',pts)}catch(e){}
   finish(n,hits,i,{pts,miss:[...new Set(miss)]});
   shell(doneBox(n,`${FD(`<div class="tag">${full?'Крепость спасена! 🏯':'Дракон устал 😴'}</div>`)}<div class="res">⭐ ${pts}</div>
    <p class="lead">${rec?'Новый рекорд! 🏆 ':''}${full?'Крепость спасена!':'Крепость устояла не до конца — можно повторить для закрепления!'} Угадано ${hits} из ${i}.</p>
    ${miss.length?`<p class="lead">Можно повторить для закрепления: <span class="py">${[...new Set(miss)].join(', ')}</span></p>`:''}`,true));$('#again').onclick=play;}}}

/* ---- 10. survey (with the name: the teacher wants to know who says what) ---- */
const LIKES=['🎮 Игры (шутер, дракон…)','✍️ Писать иероглифы','📜 История иероглифов','🗣️ Говорить по-китайски','🎙️ Записывать голос','📝 Диктанты','🤖 Разговор с 小明','👂 Слушать и угадывать слоги','🧩 Тестики','🎨 Как всё нарисовано'];
const HARD=['🎵 Тоны','👂 Различать слоги на слух','💨 Предыхание p t k','✍️ Порядок черт','🧠 Писать по памяти','🔤 Пиньинь','🗣️ Говорить вслух','📝 Диктант','⏱️ Всё слишком быстро'];
const MORE=['📜 Иероглифы и их история','💬 Больше слов и фраз','🇨🇳 Китай: школа, еда, праздники','🤖 Болтать с ИИ по-китайски','🎵 Тоны и произношение','🎮 Больше игр','🎬 Мультики и видео','🎵 Китайские песни'];
const SQ=[
 {k:'mood',t:'😍 Как тебе вообще наши уроки китайского?',type:'scale',o:['😴 скучно','😐 так себе','🙂 нормально','😃 классно','🤩 обожаю']},
 {k:'like',t:'👍 Что тебе нравится больше всего?',sub:'Можно выбрать несколько',type:'chips',o:LIKES,other:'Своё…'},
 {k:'dislike',t:'👎 А что не очень или скучно?',sub:'Честно-честно, учитель не обидится 🙂',type:'chips',o:LIKES.concat(['🙌 Всё нормально']),other:'Своё…'},
 {k:'hard',t:'😵 Что даётся труднее всего?',type:'chips',o:HARD,other:'Своё…'},
 {k:'easy',t:'😎 А что легче всего?',type:'chips',o:HARD.filter(x=>!x.includes('быстро')),other:'Своё…'},
 {k:'more',t:'🔍 Про что хочется узнать побольше?',type:'chips',o:MORE,other:'Своё…'},
 {k:'lack',t:'🤔 Где было мало объяснений или мало тренировки?',sub:'Например: «не понял(а) про тоны», «мало диктантов»',type:'text',ph:'Напиши, если что-то есть'},
 {k:'games',t:'🎮 Какие игры добавить? Может, у тебя есть любимые игры?',sub:'На телефоне, компе, приставке — любые. Мы можем сделать похожую про китайский!',type:'text',ph:'Например: Майнкрафт, Brawl Stars, угадайка…'},
 {k:'design',t:'🎨 Как тебе оформление: цвета, картинки, кнопки?',type:'scale',o:['👎 не нравится','🤷 норм','👍 нравится','🔥 огонь']},
 {k:'comfy',t:'📱 Удобно ли делать задания?',type:'chips',o:['✅ Всё удобно','🔇 Иногда не работает звук','🔍 Мелко, плохо видно','🐢 Тормозит','🗺️ Трудно найти задание','🎤 Не работает микрофон'],other:'Своё…'},
 {k:'idea',t:'💡 Есть идеи или пожелания? Что угодно!',type:'text',ph:'Пиши как хочешь 🙂'}];
function survey(){const n=10;const A=S.sv||{};let i=0;
 const intro=()=>{shell(`${backBtn}${tag(n)}<h2>💬 Как тебе уроки?</h2><p class="lead">Учитель хочет сделать уроки ещё круче — и для этого ей нужно твоё мнение! 11 коротких вопросов, где-то просто нажать, где-то написать пару слов.</p>
   <div class="tip">✋ Опрос <b>с твоим именем</b>: так учитель поймёт, что нравится именно тебе. Пиши честно — за ответы ничего не будет, правильных и неправильных тут нет 🙂</div>
   <div class="row" style="justify-content:center"><button class="btn" id="st">Начать →</button></div>`);$('#st').onclick=ask;};
 const save=()=>{S.sv=A;keepS();};
 const ask=()=>{if(i>=SQ.length)return end();const q=SQ[i];const v=A[q.k];
  shell(`${backBtn}${tag(n)}<div class="qhead" style="margin-top:6px"><span>Вопрос ${i+1} из ${SQ.length}</span><span>${Math.round(i/SQ.length*100)}%</span></div><div class="tbar"><i style="width:${i/SQ.length*100}%;background:linear-gradient(90deg,#5B6BD8,#FF7FA2)"></i></div>
   <h2 style="margin-top:14px">${q.t}</h2>${q.sub?`<p class="lead">${q.sub}</p>`:''}<div id="qa" style="margin-top:14px"></div>
   <div class="row" style="justify-content:space-between"><button class="btn g" id="bk">‹ Назад</button><button class="btn" id="nx">${i===SQ.length-1?'Готово ✓':'Дальше →'}</button></div>`);
  const qa=$('#qa');
  if(q.type==='scale'){qa.innerHTML=`<div class="scl">${q.o.map((x,j)=>`<button class="n${v===x?' on':''}" data-v="${esc(x)}"><span>${x.split(' ')[0]}</span><small>${x.split(' ').slice(1).join(' ')}</small></button>`).join('')}</div>`;
   qa.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{A[q.k]=b.dataset.v;save();qa.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));later(()=>{i++;ask();},350);});}
  else if(q.type==='chips'){const sel=new Set((v&&v.pick)||[]);
   qa.innerHTML=`<div class="chips">${q.o.map(x=>`<button class="chip n${sel.has(x)?' on':''}" data-c="${esc(x)}" style="font:800 16px Manrope">${x}</button>`).join('')}</div>
    <input id="ot" class="in" style="width:100%;font:inherit;font-size:17px;padding:12px 16px;border:0;outline:none;margin-top:14px;color:var(--ink)" placeholder="${q.other||'Своё…'}" maxlength="200" value="${esc((v&&v.text)||'')}">`;
   qa.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const x=b.dataset.c;sel.has(x)?sel.delete(x):sel.add(x);b.classList.toggle('on');A[q.k]={pick:[...sel],text:$('#ot').value.trim()};save();});
   $('#ot').oninput=()=>{A[q.k]={pick:[...sel],text:$('#ot').value.trim()};save();};}
  else{qa.innerHTML=`<textarea id="tx" class="in" rows="4" style="width:100%;font:inherit;font-size:17px;padding:14px 16px;border:0;outline:none;color:var(--ink);resize:vertical" placeholder="${q.ph||''}" maxlength="600">${esc(v||'')}</textarea>`;
   $('#tx').oninput=()=>{A[q.k]=$('#tx').value.trim();save();};}
  $('#nx').onclick=()=>{i++;ask();};$('#bk').onclick=()=>{if(i===0)intro();else{i--;ask();}};};
 const end=()=>{const out={};SQ.forEach(q=>{if(A[q.k]!=null&&A[q.k]!=='')out[q.k]=A[q.k];});send('survey',out);finish(n,1,1,{answers:Object.keys(out).length});
  shell(doneBox(n,`<div style="font-size:80px;text-align:center">💜</div><div class="res" style="text-align:center">Спасибо!</div><p class="lead" style="text-align:center">Учитель прочитает каждый твой ответ. 谢谢！ <span class="py">xièxie!</span></p>`,false).replace(/<button class="btn" onclick="location.hash='#11'">.*?<\/button>/,''));};
 intro();}

route();
</script></body></html>

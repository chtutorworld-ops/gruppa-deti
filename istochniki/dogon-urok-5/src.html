<script>
/* ===================== audio: the teacher's voice first, then the course voice ===================== */
const AUDIO=(/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname))&&!/workers\.dev$/.test(location.hostname)?new URL('../audio/',location.href).href:'https://chtutorworld-ops.github.io/gruppa-deti-sait/audio/';
const VOICE=AUDIO+'voice/';let VOK=null;const VOKP=fetch(VOICE+'index.json?'+Date.now()).then(r=>r.json()).then(j=>VOK=j).catch(()=>{});
const fn=t=>AUDIO+[...t].map(c=>c.codePointAt(0).toString(16)).join('-')+'.mp3';
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
const V={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù'};
const mark=(b,t)=>{if(!t)return b;let k=b.search(/a|e/);if(k<0)k=b.indexOf('ou');if(k<0){for(let j=b.length-1;j>=0;j--)if('aeiou'.includes(b[j])){k=j;break;}}return b.slice(0,k)+V[b[k]][t-1]+b.slice(k+1);};
const vkey=s=>{const t=SYL.tone(s);let b=SYL.plain(s);if(b==='i')b='yi';return b+t;};
let curA=null,curSrc=[],playTok=0;const BUF={};
const acx=()=>window.AC||(window.AC=new (window.AudioContext||window.webkitAudioContext)());
addEventListener('pointerdown',()=>{try{acx().resume()}catch(e){}},{passive:true});
function trimB(b){const d=b.getChannelData(0),sr=b.sampleRate;let pk=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;}const th=pk*0.04;
 let a=0,e=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(e>a&&Math.abs(d[e])<th)e--;a=Math.max(0,a-Math.round(sr*.015));e=Math.min(d.length,e+Math.round(sr*.06));
 if(e-a<sr*.05)return b;const o=acx().createBuffer(1,e-a,sr);o.copyToChannel(d.slice(a,e),0);return o;}
function loadB(u){return BUF[u]||(BUF[u]=fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);})).then(trimB).catch(e=>{delete BUF[u];throw e;}));}
const preload=us=>us.filter(Boolean).forEach(u=>loadB(u).catch(()=>{}));
function stopAll(){playTok++;try{curA&&curA.pause()}catch(e){}curSrc.forEach(x=>{try{x.stop()}catch(e){}});curSrc=[];}
function playOld(u,el){return new Promise(res=>{const a=new Audio(u);curA=a;el&&el.classList.add('on');const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;a.onerror=end;a.play().catch(end);});}
// several files back to back with a short gap, no network pause between them
async function playList(urls,el,gap){urls=urls.filter(Boolean);if(!urls.length)return;stopAll();const tok=playTok;el&&el.classList.add('on');
 let bufs=null;const ctx=acx();try{ctx.resume();bufs=await Promise.all(urls.map(loadB));}catch(e){bufs=null;}
 if(tok!==playTok){return;}
 if(!bufs){for(const u of urls){if(tok!==playTok)return;await playOld(u);}el&&el.classList.remove('on');return;}
 let t=ctx.currentTime+0.02;const g=gap==null?0.25:gap;curSrc=bufs.map(b=>{const x=ctx.createBufferSource();x.buffer=b;x.connect(ctx.destination);x.start(t);t+=b.duration+g;return x;});
 await new Promise(r=>setTimeout(r,Math.max(0,(t-g-ctx.currentTime)*1000)));if(tok===playTok)el&&el.classList.remove('on');}
const urlS=s=>{const k=vkey(s);if(VOK&&VOK[k])return VOICE+k+'.wav';const c=SYL.char(s);return c?fn(c):null;};
const urlK=k=>VOK&&VOK[k]?VOICE+k+'.wav':null;              // b0, p0 …: the teacher's pure initial sound
const playS=(s,el)=>playList([urlS(s)],el);
// a training pair of syllables in the teacher's voice, said with the tone change:
// 3 + 3 → the first syllable is taken with the 2nd tone; 3 + 4 → the first 3rd tone is cut after its low part (no rise)
async function playPair(py,el){const [a,b]=py.split(' '),ta=SYL.tone(a),tb=SYL.tone(b);stopAll();const tok=playTok;
 const first=ta===3&&tb===3?mark(SYL.plain(a),2):a;const half=ta===3&&tb!==3;
 const ctx=acx();let A,B;try{ctx.resume();[A,B]=await Promise.all([urlS(first),urlS(b)].map(loadB));}catch(e){return playList([urlS(first),urlS(b)],el,.05);}
 if(tok!==playTok)return;
 if(half){const d=A.getChannelData(0),n=Math.floor(d.length*.6),o=ctx.createBuffer(1,n,A.sampleRate),c=d.slice(0,n),f=Math.floor(A.sampleRate*.04);
  for(let i=0;i<f;i++)c[n-1-i]*=i/f;o.copyToChannel(c,0);A=o;}
 el&&el.classList.add('on');let t=ctx.currentTime+.02;[A,B].forEach(x=>{const src=ctx.createBufferSource();src.buffer=x;src.connect(ctx.destination);src.start(t);curSrc.push(src);t+=x.duration+.04;});
 await new Promise(r=>setTimeout(r,Math.max(0,(t-ctx.currentTime)*1000)));if(tok===playTok)el&&el.classList.remove('on');}
// the same pair with a partner initial: b/p, d/t, g/k, m/n, n/l, f/h
const SWAP={b:'p',p:'b',d:'t',t:'d',g:'k',k:'g',m:'n',n:'l',l:'n',f:'h',h:'f'};
const swapIni=w=>{const c=w[0];return SWAP[c]?SWAP[c]+w.slice(1):w;};
const pairQuiz=list=>noTriple(list,x=>x[0]).map(py=>{const [a,b]=py.split(' ');const o=[py,swapIni(a)+' '+b,a+' '+swapIni(b)];
 return {play:el=>playPair(py,el),q:'Какую пару ты услышал?',opts:o.map(x=>`<span class="py">${tpy(x)}</span>`),right:`<span class="py">${tpy(py)}</span>`,ok:tpy(py)};});
// a word in the teacher's voice if she recorded it on zapis/ (id da3gu3), otherwise the course mp3
const wid=py=>py.split(' ').map(x=>SYL.plain(x)+SYL.tone(x)).join('');
const urlW=hz=>{const w=[...W33,...W34,['你好','nǐ hǎo'],['我叫','wǒ jiào']].find(x=>x[0]===hz);const k=w&&wid(w[1]);return k&&VOK&&VOK[k]?VOICE+k+'.wav':fn(hz);};
const playW=(hz,el)=>playList(hz.split(' ').map(urlW),el);      // '你好 我叫 达莉娅' = a phrase from pieces

/* ===================== pitch (YIN), as in ДЗ 2 ===================== */
async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
// melody of the whole word: pitched frames only, gaps between syllables kept as gaps
function melody(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2;let mx=0;const rms=[];
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.12),f=[];let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=thr?yin(pcm.subarray(i,i+F),sr):[0,1];f.push(v>65&&v<550&&ap<0.2?v:0);}
 for(let i=0;i<f.length;i++){if(!f[i])continue;const nb=[];for(let d=1;d<=5;d++){if(f[i-d])nb.push(f[i-d]);if(f[i+d])nb.push(f[i+d]);}
  if(!nb.length){f[i]=0;continue;}nb.sort((p,q)=>p-q);if(Math.abs(12*Math.log2(f[i]/nb[nb.length>>1]))>5)f[i]=0;}
 let a=f.findIndex(x=>x>0),b=f.length-1;while(b>=0&&!f[b])b--;if(a<0||b-a<8)return null;
 const seg=f.slice(a,b+1),vs=seg.filter(x=>x>0).sort((p,q)=>p-q);if(vs.length<8)return null;const med=vs[vs.length>>1];
 return seg.map(x=>x>0?Math.max(-9,Math.min(9,12*Math.log2(x/med))):null);}
function melSvg(lines){const W=520,H=170,y=v=>H/2-v*(H-30)/18;let out=`<svg class="mel" viewBox="0 0 ${W} ${H}">${[-6,-3,0,3,6].map(v=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE1EA" stroke-width="1"/>`).join('')}`;
 lines.forEach(([m,col,w,dash])=>{if(!m)return;const n=m.length;let d='',pen=false;m.forEach((v,i)=>{if(v===null){pen=false;return;}const x=14+i*(W-28)/(n-1);d+=(pen?'L':'M')+x.toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;});
  out+=`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${dash?'stroke-dasharray="2 9"':''}/>`;});
 return out+'</svg>';}
const melCache={};
async function refMel(hz){if(melCache[hz])return melCache[hz];try{const r=await fetch(urlW(hz));return melCache[hz]=melody(await toPCM(await r.arrayBuffer()));}catch(e){return null;}}

/* ===================== microphone ===================== */
let micStream=null;
async function getMic(){if(micStream&&micStream.active)return micStream;micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});return micStream;}
function pickType(){for(const t of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))return t;return '';}

 ${tones.map((t,k)=>{const x=u=>k*w+12+u*(w-24);return `<path d="${TPTS[t].map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ')}" stroke="${TCOL[t]}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+(cross===k?`<path d="M${k*w+16} 12L${k*w+w-16} ${h-12}M${k*w+w-16} 12L${k*w+16} ${h-12}" stroke="#FF5C8A" stroke-width="4" stroke-linecap="round" opacity=".75"/>`:'');}).join('')}</svg>`;};

 const pool=[];L3I.forEach(i=>OKSYL[i].split(' ').forEach(f=>[1,2,3,4].forEach(t=>{const s=mark(i+f,t);if(hasAudio(s))pool.push(s);})));

 const sUrl=x=>{const k=vkey(x);return VOK&&VOK[k]?VOICE+k+'.wav':fn(SYL.char(x));},AC={};

const TPAIR={'2-3':'Во 2-м тоне голос сразу идёт вверх, а в 3-м сначала опускается вниз.','1-4':'1-й тон держится наверху, а 4-й падает вниз.','1-2':'1-й ровный, а 2-й поднимается.','3-4':'3-й опускается и задерживается внизу, а 4-й падает резко и коротко.','2-4':'2-й идёт вверх, 4-й — вниз: движения противоположные.','1-3':'1-й высокий и ровный, а 3-й низкий.'};
function parts(s){const t=SYL.tone(s),[i,f]=split(SYL.plain(s));return [i,f,t];}
function explain(r,g){const out=[];
 if(r[0]!==g[0]){let x=`Инициаль: звучала <b>${r[0]}</b>, а у тебя <b>${g[0]}</b>. ${IDESC[r[0]]||''}.`;if(PAIRA[r[0]]===g[0]&&(ASP[r[0]]||ASP[g[0]]))x+=' Различаем по выдоху!';else if(IDESC[g[0]])x+=' А '+IDESC[g[0]]+'.';out.push(x);}
 if(r[1]!==g[1])out.push(`Финаль: звучала <b>${r[1]}</b>, а у тебя <b>${g[1]}</b>. ${FDESC[r[1]]}, а ${FDESC[g[1]]}.`);
 if(r[2]!==g[2]){const k=[r[2],g[2]].sort().join('-');out.push(`Тон: звучал <b>${r[2]}-й</b>, а у тебя <b>${g[2]}-й</b>. ${TDESC[r[2]]}. ${TPAIR[k]||''}`);}
 return out;}

 P6='<span class="part"><b>名字</b> имена</span>';
const task=(n,t,what)=>`${taskHd(n,t)}<p class="lead">${what}</p><div class="tk" id="tk"></div>`;
const CHAINS=[['bā','bá','bǎ','bà'],['dī','dí','dǐ','dì'],['pū','pú','pǔ','pù'],['mō','mó','mǒ','mò']];
const PICT=[['ren','人','rén','человек'],['ri','日','rì','солнце'],['yue','月','yuè','луна'],['shan','山','shān','гора'],['mu','木','mù','дерево'],['kou','口','kǒu','рот']];
const IMG='../urok-5/img/';
const RAD=[['亻','rén','человек','🧍',['你','他','们']],['口','kǒu','рот','👄',['叫','吃','喝']],['女','nǚ','женщина','👩',['好','妈','她']],['氵','shuǐ','вода','💧',['河','湖','海']]];
const DET=[['河','hé','氵','💧 что-то про воду','река — вспомни 河马 hémǎ, «речная лошадь» = бегемот!'],['妈','mā','女','👩 что-то про женщину','мама'],['吃','chī','口','👄 что-то про рот','есть, кушать'],['你','nǐ','亻','🧍 что-то про человека','ты']];
const charStep=(c,py,ru,parts,rules)=>({t:c+' — '+ru,h:()=>`${P5}<h2>${c} — ${ru}</h2><div class="hz"><button class="zh say" data-w="${c}">${c}</button><span class="py">${py}</span></div>
  <div class="chl"><div class="lft">${hzcell(c,260)}<small class="hint2">${parts}</small></div><div>${rules.map(([ic,t])=>`<div class="rl n"><span class="ic">${ic}</span><span>${t}</span></div>`).join('')}</div></div>
  <h3>Теперь ты: обведи ${c}</h3><p class="lead" style="margin-top:0">Посмотри, как пишется, и обведи пальцем по порядку черт.</p><div class="tk" id="tr1"></div>`,
 on:()=>{animCells();traceOne(c);}});
const zh=s=>`<span class="zh-i">${s}</span>`;

const STEPS=[
 {t:'Начало',h:()=>`<span class="part"><b>补课</b> bǔkè · догоняем</span>
  <h2>Привет, Радмир! Догоняем урок 5 👋</h2>
  <p class="lead">На уроке 5 группа узнала, <b>откуда взялись иероглифы</b>, что такое <b>ключи</b>, научилась писать ${zh('你 我 好 叫')}, прописала <b>свои имена</b> по-китайски и познакомилась с мальчиком 小明. Здесь всё то же самое — по шагам и подробно. Нажимай на всё со значком 🔊 и повторяй вслух. Задания урока ты делаешь <b>прямо здесь</b>, и учитель увидит твои результаты.</p>
  <h3>Кто занимается?</h3>
  <div class="who">${[['Радмир','это я'],['учитель','проверка, ничего не сохраняется']].map(([n,s])=>`<button class="n${ST.name===n?' on':''}" data-who="${n}">${n==='учитель'?'Учитель':n}<small>${s}</small></button>`).join('')}</div>
  <div class="toc">
   <div class="n"><span style="background:#FFF1D6">🔥</span>Разминка: цепочки тонов, «с выдохом и без», шутер и контрольный диктант</div>
   <div class="n"><span style="background:#E4E8FF">🔁</span>Вспоминаем урок 4: 3 + 3, 3 + 4, 你好, 我叫</div>
   <div class="n"><span style="background:#FFE3EB">📜</span>Иероглифы: кости, рисунки, лошадь 马</div>
   <div class="n"><span style="background:#F0E6FF">🔑</span>Ключи — подсказки смысла</div>
   <div class="n"><span style="background:#DDF5EC">✍️</span>Пишем 你 我 好 叫 и своё имя 拉德米尔</div>
   <div class="n"><span style="background:#FFF1D6">👋</span>Знакомимся: 你好！我叫… и мальчик 小明</div>
   <div class="n"><span style="background:#DDF5EC">🏁</span>Финиш — и сразу домашнее задание к уроку 5</div>
  </div>
  <div class="tip">🎧 Включи звук. 🎤 Иногда понадобится микрофон. ✍️ Прописи удобнее делать на телефоне или планшете пальцем. Можно делать в несколько заходов: страница запомнит, где ты остановился.</div>`,
  on:()=>document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ST.name=b.dataset.who;if(!ST.sid)ST.sid='dg5-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);keep();document.querySelectorAll('[data-who]').forEach(x=>x.classList.toggle('on',x===b));toast(ST.name==='учитель'?'Режим проверки: результаты не сохраняются':'Привет, Радмир! 你好！');})},

 /* ---------- warm-up ---------- */
 {t:'Разминка: цепочки тонов',h:()=>`${P1}<h2>Разминка: 4 цепочки</h2><div class="hz"><span class="zh">热身</span><span class="py">rèshēn</span></div>
  <p class="lead">Урок начался с разминки: каждый читал цепочки вслух. Нажми на слог, послушай и прочитай <b>всю цепочку</b> вслух: 1-й, 2-й, 3-й, 4-й тон.</p>
  <div class="tc">${CHAINS.map((g,i)=>`<div class="card n"><b style="font:900 22px Nunito;color:var(--mu)">${i+1}</b><div class="chips" style="margin-top:0">${g.map(s=>`<button class="chip n" data-s="${s}" style="color:${TCOL[SYL.tone(s)]}">${s}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="tones" style="grid-template-columns:repeat(4,1fr)">${[[1,'высоко и ровно'],[2,'снизу вверх'],[3,'вниз и чуть вверх'],[4,'резко вниз']].map(([t,r])=>`<div class="tone n">${curve([t],70,46)}<small>${t}-й: ${r}</small></div>`).join('')}</div>
  <div class="qbox in" id="q1"></div>`,
  on:()=>quiz('#q1','tones','Какой тон?',noTriple([['ba',3],['di',2],['pu',4],['mo',1],['bi',4],['da',2]],x=>x[1]).map(([b,t])=>({play:[urlS(mark(b,t))],q:'Послушай и выбери тон',opts:[1,2,3,4].map(x=>`<span class="py" style="color:${TCOL[x]}">${mark(b,x)}</span>`),right:`<span class="py" style="color:${TCOL[t]}">${mark(b,t)}</span>`,ok:`${t}-й тон`})),4)},

 {t:'С выдохом и без',h:()=>`${P1}<h2>С выдохом и без: b — p, d — t, g — k</h2>
  <p class="lead">Самая частая ошибка: читать <b>p</b> как русское «п». Китайское <b>p</b> — это «<b>пх</b>»: звук с <b>сильным выдохом</b>. Так же <b>t</b> = «тх», <b>k</b> = «кх». А <b>b, d, g</b> — без выдоха, мягкие.</p>
  <div class="cards c2"><div class="card n"><span class="ic">📄</span><b class="h">Проверка листком</b>Поднеси листок бумаги ко рту: на <b>p, t, k</b> он должен шевелиться, на <b>b, d, g</b> — нет.</div>
   <div class="card n"><span class="ic">✋</span><b class="h">Проверка ладонью</b>Ладонь у рта: на <b>pā</b> чувствуешь струю воздуха, на <b>bā</b> — почти ничего.</div></div>
  <p class="lead">Нажимай по парам: слева без выдоха, справа — <b style="color:var(--t4)">с выдохом</b>.</p>
  <div class="chips">${[['bō','pō'],['dé','tè'],['gē','kē'],['bà','pà'],['dú','tú'],['gǔ','kǔ']].map(([a,b])=>`<span style="display:inline-flex;gap:6px"><button class="chip n" data-s="${a}">${a}</button><button class="chip n" data-s="${b}" style="color:var(--t4)">${b}</button></span>`).join('')}</div>
  <div class="qbox in" id="q2"></div>`,
  on:()=>{const P=[['pa',4,'ba'],['ti',2,'di'],['ku',3,'gu'],['bo',1,'po'],['da',4,'ta'],['ke',1,'ge'],['pu',2,'bu'],['ge',4,'ke']];let order=P;for(let k=0;k<100;k++){order=shuffle(P);if(order.every((x,i)=>!i||x[0][0]!==order[i-1][0][0]&&x[0][0]!==order[i-1][2][0]))break;}
   quiz('#q2','asp','С выдохом или без?',order.map(([b,t,alt])=>({play:[urlS(mark(b,t))],q:'Какой слог прозвучал?',opts:[mark(b,t),mark(alt,t)],right:mark(b,t),ok:'Да, '+mark(b,t)+('ptk'.includes(b[0])?' — с выдохом':' — без выдоха')})),2);}},

 {t:'Шутер',h:()=>`${P1}${task(1,'🎯 Шутер: лови слог','На уроке это задание делали на телефоне, на скорость. Слог звучит — стреляй по шарику с этим слогом. Слоги из инициалей <b>b p m f d t n l g k h</b> и финалей <b>a o e i u</b>.')}`,on:shooter},
 {t:'Контрольный диктант',h:()=>`${P1}${task(2,'📝 Контрольный диктант','Слушай слог и набери его: <b>инициаль + финаль + тон</b>. Помни про выдох: p, t, k — с выдохом!')}`,on:kdict},

 /* ---------- lesson 4 review ---------- */
 {t:'Вспоминаем урок 4',h:()=>`${P2}<h2>Вспоминаем: тоны в словах</h2>
  <p class="lead">Когда два тона стоят рядом, 3-й тон меняется:</p>
  <div class="cmp">
   <div class="card n"><span class="k">3 + 3</span>${curve([2,3],90,70)}<div>первый 3-й звучит как <b style="color:var(--t2)">2-й</b>: <span class="ipy">nǐ hǎo</span> → «ní hǎo»</div></div>
   <div class="card n"><span class="k">3 + 4</span>${curve(['h',4],90,70)}<div>3-й звучит <b>наполовину</b>: только вниз, без подъёма</div></div>
  </div>
  <div class="tip">✍️ Пишем всегда <b>как в словаре</b> (<span class="ipy">nǐ hǎo</span>), меняется только голос.</div>
  <h3>Послушай и повтори</h3>${wordBtns([W33[0],W34[0],W33[3],W34[1],['你好','nǐ hǎo','ní hǎo','привет'],['我叫','wǒ jiào','','меня зовут']],true)}`},
 {t:'Повторяем урок 4',h:()=>`${P2}${task(3,'Повторяем урок 4','Скажи вслух 你好 и 我叫, а потом угадай на слух: это <b>3 + 3</b> или <b>3 + 4</b>?')}`,on:review4},

 /* ---------- hanzi ---------- */
 {t:'汉字 — иероглифы',h:()=>`${P3}<h2>Китайские иероглифы</h2><div class="hz"><button class="zh say" data-w="汉字">汉字</button><span class="py">hànzì</span></div>
  <img class="photo" src="${IMG}callig.jpg" alt="Рука с кистью пишет иероглифы в тетради-прописи с клетками" style="object-position:50% 60%">
  <div class="cards">${[['📜','Иероглифам больше <b>3000 лет</b> — это одна из самых древних письменностей мира, которой пользуются до сих пор.'],['🔤','Иероглиф — не буква. Один иероглиф = <b>один слог</b> и <b>свой смысл</b>: '+zh('好')+' <span class="ipy">hǎo</span> — «хорошо».'],['📚','В больших словарях больше <b>50 000</b> иероглифов, а чтобы читать газеты, хватит около <b>3000</b>.']].map(([e,t])=>`<div class="card n" style="display:flex;gap:12px"><span style="font-size:26px">${e}</span><span>${t}</span></div>`).join('')}</div>
  ${chk('Что обозначает <b>один</b> иероглиф?',['Один слог и свой смысл','Одну букву, как в русском','Целое предложение'],0,'Например, 好 hǎo — один слог и смысл «хорошо».')}`},
 {t:'Письмена на костях',h:()=>`${P3}<h2>Письмена на костях</h2><div class="hz"><span class="zh">甲骨文</span><span class="py">jiǎgǔwén</span></div>
  <img class="photo" src="${IMG}bone.jpg" alt="Древняя лопаточная кость быка, покрытая надписями" style="max-height:380px;object-fit:contain;background:#fff">
  <div class="cards">${[['🐢','Самые древние иероглифы нашли на <b>панцирях черепах</b> и <b>костях быков</b>. Им около <b>3300 лет</b>.'],['🔥','Древние гадатели писали на кости вопрос, нагревали её и «читали» ответ по трещинам: будет ли дождь? будет ли урожай?'],['✏️','Такие знаки называют '+zh('甲骨文')+' — «письмена на панцирях и костях». Многие из них были похожи на <b>рисунки</b>.']].map(([e,t])=>`<div class="card n" style="display:flex;gap:12px"><span style="font-size:26px">${e}</span><span>${t}</span></div>`).join('')}</div>
  <p class="hint2" style="margin-top:8px">Фото: Wikimedia Commons</p>
  ${chk('На чём писали самые древние иероглифы?',['На панцирях черепах и костях быков','На бумаге','На камнях в пещерах'],0,'Это 甲骨文 — письмена на панцирях и костях.')}`},
 {t:'Иероглифы-рисунки',h:()=>`${P3}<h2>Иероглифы были рисунками</h2><div class="hz"><span class="zh">象形字</span><span class="py">xiàngxíngzì</span></div>
  <p class="lead">Слева — древний знак на кости. Угадай, что нарисовано, и <b>нажми на карточку</b>: откроется, как этот иероглиф пишут сейчас.</p>
  <div class="pics">${PICT.map(([f,c,p,r])=>`<button class="n" data-pic="${c}"><img src="${IMG}${f}.png" alt="древний знак ${c}"><span class="ar">→</span><span class="md"><span class="q">?</span></span><small>нажми</small></button>`).join('')}</div>
  <div class="qbox in" id="qpic"></div>`,
  on:()=>{document.querySelectorAll('[data-pic]').forEach(b=>b.onclick=()=>{const [f,c,p,r]=PICT.find(x=>x[1]===b.dataset.pic);b.querySelector('.md').innerHTML=`<span class="zh">${c}</span><span class="py">${p}</span>`;b.querySelector('small').textContent=r;playW(c,b);});
   quiz('#qpic','pict','Узнай рисунок',shuffle(PICT).map(([f,c,p,r])=>({q:`<img src="${IMG}${f}.png" alt="древний знак" style="width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 6px">Какой это иероглиф сейчас?`,opts:shuffle(PICT.filter(x=>x[1]!==c)).slice(0,3).map(x=>`<span class="zh" style="font-size:40px">${x[1]}</span>`).concat(`<span class="zh" style="font-size:40px">${c}</span>`),right:`<span class="zh" style="font-size:40px">${c}</span>`,ok:`<span class="zh">${c}</span> ${p} — ${r}`})),4);}},
 {t:'Как менялась лошадь',h:()=>`${P3}<h2>Как менялась «лошадь» 马</h2>
  <div class="evo">${[['ma-oracle','на костях','3300 лет назад'],['ma-bronze','на бронзе','3000 лет назад'],['ma-seal','печатный','2200 лет назад']].map(([f,a,b])=>`<div class="n"><img src="${IMG}${f}.png" alt="马 ${a}"><b>${a}</b><small>${b}</small></div>`).join('')}
   <div class="n"><span class="zh">馬</span><b>полный</b><small>Тайвань, Гонконг</small></div>
   <div class="n me"><button class="zh say" data-w="马">马</button><b>упрощённый</b><small>мы учим этот!</small></div></div>
  <p class="lead">Голова с гривой, ноги, хвост — лошадь «повернули» вертикально, чтобы удобно было писать столбиком. Сегодня в Китае пишут <b>упрощённые</b> иероглифы, их мы и учим.</p>
  ${chk('Какой иероглиф «лошадь» мы учим?',['<span class="zh" style="font-size:28px">马</span> — упрощённый','<span class="zh" style="font-size:28px">馬</span> — полный'],0,'В Китае пишут упрощённые иероглифы.',true)}`},

 /* ---------- radicals ---------- */
 {t:'Ключи 部首',h:()=>`${P4}<h2>Ключи — подсказки смысла</h2><div class="hz"><span class="zh">部首</span><span class="py">bùshǒu</span></div>
  <p class="lead">🔑 <b>Ключ</b> — часть иероглифа, которая подсказывает, <b>о чём он</b>. Как значок папки на компьютере: увидел 💧 — значит, что-то про воду. Нажимай на иероглифы и слушай.</p>
  <div class="rads">${RAD.map(([r,p,ru,e,ex])=>`<div class="card n"><span class="em">${e}</span><span class="zh rk">${r}</span><span class="py" style="font-size:16px">${p} · ${ru}</span><div class="ex">${ex.map(c=>`<button class="zh" data-w="${c}">${c}</button>`).join('')}</div></div>`).join('')}</div>
  <h3>Слева — смысл, справа — звучание</h3>
  <p class="lead" style="margin-top:0">Во многих иероглифах <b>слева</b> стоит ключ, он подсказывает <b>значение</b>, а <b>справа</b> часть, которая подсказывает <b>звучание</b>:</p>
  <div class="lr"><div><span class="zh">女</span><small>женщина<br>значение</small></div><span class="pl">+</span><div><span class="zh">马</span><small>mǎ<br>звучание</small></div><span class="pl">=</span><div><button class="zh say" data-w="妈">妈</button><small>mā · мама</small></div></div>
  <div class="tip">💡 Мама — женщина (ключ ${zh('女')}), а звучит почти как ${zh('马')} mǎ, только другим тоном: <b>mā</b>. Это правило «часто», а не «всегда» — но очень помогает угадывать!</div>
  ${chk('Где в иероглифе 妈 подсказка <b>смысла</b>?',['Слева: 女 «женщина»','Справа: 马 «лошадь»'],0,'Слева значение, справа звучание: 妈 mā — мама.',true)}`},
 {t:'Ключ-детектив',h:()=>`${P4}<h2>🕵️ Ключ-детектив</h2><div class="hz"><span class="zh">猜一猜</span><span class="py">cāi yi cāi</span></div>
  <p class="lead">Найди в иероглифе ключ и <b>угадай</b>, о чём он. Потом нажми на карточку — откроется подсказка, нажми ещё раз — ответ.</p>
  <div class="det">${DET.map(([c,p,r,h,a],i)=>`<button class="card n" data-det="${i}" style="text-align:left"><span class="big">${c}</span><span class="py" style="font-size:20px">${p}</span><span class="h1 hid">ключ <span class="zh" style="font-size:24px">${r}</span> → ${h}</span><span class="h2 hid" data-a>${a}</span></button>`).join('')}</div>`,
  on:()=>document.querySelectorAll('[data-det]').forEach(b=>{let st=0;b.onclick=()=>{st++;const [c]=DET[+b.dataset.det];if(st===1){b.querySelector('.h1').classList.remove('hid');}else{b.querySelector('[data-a]').classList.remove('hid');playW(c,b);}};})},
 {t:'Ключи — задание',h:()=>`${P4}${task(4,'🔑 Найди смысл ключа','Видишь ключ — выбери значок, что он значит. Видишь рисунок — найди ключ.')}`,on:radicals},

 /* ---------- writing ---------- */
 {t:'Правила порядка черт',h:()=>`${P5}<h2>В каком порядке писать черты</h2><div class="hz"><span class="zh">笔顺</span><span class="py">bǐshùn</span></div>
  <p class="lead">Иероглиф пишут не как попало, а <b>по порядку черт</b>. Вот 6 главных правил — смотри, как рисуется каждый пример.</p>
  <div class="rules">${[['三','Сверху вниз'],['川','Слева направо'],['十','Сначала горизонталь, потом вертикаль'],['人','Сначала влево, потом вправо'],['日','Сначала рамка, потом внутри, «дверь» закрываем в конце'],['小','Сначала середина, потом бока']].map(([c,t],i)=>`<div class="card n">${hzcell(c,120)}<small>Правило ${i+1}</small><b>${t}</b></div>`).join('')}</div>
  ${chk('Что пишем раньше в 十?',['Горизонталь, потом вертикаль','Вертикаль, потом горизонталь'],0,'Правило 3: сначала горизонталь.',true)}
  ${chk('Как пишем 日?',['Рамка, потом внутри, низ рамки в конце','Сначала середину, потом рамку','Снизу вверх'],0,'Правило 5: «дверь» закрываем в конце.')}`,
  on:animCells},
 charStep('你','nǐ','ты','亻 человек + 尔 · 7 черт',[
  ['🧍','Слева ключ '+zh('亻')+' «человек»: «ты» — это человек.'],
  ['➡️','Пишем <b>слева направо</b>: сначала весь '+zh('亻')+', потом правую часть.'],
  ['⚖️','Внизу справа: сначала <b>середина</b> (крючок), потом две точки по бокам.']]),
 charStep('我','wǒ','я','7 черт',[
  ['➖','Маленькая откидная сверху, потом <b>горизонталь</b>, и только потом вертикаль с крючком: горизонталь раньше вертикали.'],
  ['↘️','Длинная косая черта с крючком — главная, она «держит» знак.'],
  ['🔴','Последняя черта — <b>точка справа вверху</b>. Не забывай её!']]),
 charStep('好','hǎo','хорошо','女 женщина + 子 ребёнок · 6 черт',[
  ['👩‍👦',zh('女')+' «женщина» + '+zh('子')+' «ребёнок»: мама с ребёнком — это <b>хорошо</b>.'],
  ['➡️','Слева направо: сначала '+zh('女')+', потом '+zh('子')+'.'],
  ['↗️','Слева '+zh('女')+' узкий: последняя черта не ровная, а <b>поднимается вверх</b>.']]),
 charStep('叫','jiào','зваться, звать','口 рот + 丩 · 5 черт',[
  ['👄','Ключ '+zh('口')+' «рот»: звать и кричать — это делает рот.'],
  ['📦',zh('口')+' — как коробка: левая стенка, верх и правая стенка одной чертой, <b>дно в конце</b>.'],
  ['⬆️','Слева '+zh('口')+' маленький и стоит повыше.']]),
 {t:'Пропись — задание',h:()=>`${P5}${task(5,'✍️ Пропись: 你 我 好 叫','Теперь все четыре иероглифа подряд, как у группы на уроке.')}`,on:writing},

 /* ---------- names, greetings, 小明 ---------- */
 {t:'Наши имена',h:()=>`${P6}<h2>Наши имена по-китайски</h2><div class="hz"><span class="zh">我们班</span><span class="py">wǒmen bān</span></div>
  <p class="lead">Русские имена по-китайски записывают иероглифами, которые <b>звучат похоже</b>. Нажми на имя — послушай. Цвет пиньиня — это тон.</p>
  <div class="nmg">${NAMES.map(n=>`<button class="n${n===ME?' me':''}" data-w="${n.hz}">${n===ME?'<span class="tag2">это ты!</span>':n.tch?'<span class="tag2" style="background:var(--ac)">老师 · учитель</span>':''}<span class="zh" style="font-size:${n.hz.length>4?34:n.hz.length>3?40:46}px">${n.hz}</span><span class="py">${pyHtml(n)}</span><small>${n.ru} 🔊</small></button>`).join('')}</div>
  <div class="tip">🎶 В твоём имени ${zh('拉德米尔')} <span class="ipy">lā dé mǐ ěr</span> в конце два 3-х тона подряд: <b>mǐ ěr</b>. Помнишь правило 3 + 3? Первый звучит как 2-й: «mí ěr».</div>`},
 {t:'Моё имя — задание',h:()=>`${P6}${task(6,'✍️ Моё имя по-китайски','Послушай своё имя, скажи вслух 我叫拉德米尔 и пропиши имя по порядку черт.')}`,on:myname},
 {t:'Здороваемся',h:()=>`${P6}<h2>你好！我叫… — здороваемся</h2>
  <p class="lead">На уроке каждый по очереди здоровался с классом и называл себя. А класс отвечал хором ${zh('你们好')} — «привет всем!».</p>
  <div class="dlg">
   <button class="ln n" data-w="你好 我叫拉德米尔"><span class="zh">你好！我叫拉德米尔。</span><span><span class="py">nǐ hǎo! wǒ jiào Lādémǐ'ěr.</span><small>Привет! Меня зовут Радмир.</small></span></button>
   <button class="ln n r" data-w="你们好"><span class="zh">你们好！</span><span><span class="py">nǐmen hǎo!</span><small>Привет всем!</small></span></button>
  </div>
  <h3>Теперь ты</h3><p class="lead" style="margin-top:0">Нажми «● Скажи», скажи <b>${zh('你好！我叫拉德米尔。')}</b>, потом «▶ Я» — послушай себя и сравни с образцом.</p>
  ${recBox('rme',[],'你好 我叫拉德米尔')}
  <div class="tip">✔️ В <b>nǐ hǎo</b> первый слог поднимается (ní), в <b>wǒ jiào</b> первый слог низкий и короткий. Запись никуда не отправляется.</div>`,
  on:()=>bindRec('rme',[['你好']],'你好 我叫拉德米尔')},
 {t:'Знакомься: 小明',h:()=>`${P6}<h2>Знакомься: 小明</h2><div class="hz"><span class="zh">认识一下</span><span class="py">rènshi yíxià</span></div>
  <p class="lead">Это ${zh('小明')} <span class="ipy">Xiǎo Míng</span> — мальчик из Китая. Вот как вы познакомитесь. Нажимай на реплики 小明 и слушай, а свои говори вслух.</p>
  <div class="xmc">${[['xm','你好！','Nǐ hǎo!','Привет!'],['me','你好！','','Ты здороваешься в ответ'],['xm','我叫小明。','Wǒ jiào Xiǎo Míng.','Меня зовут Сяо Мин.'],['xm','你叫什么名字？','Nǐ jiào shénme míngzi?','Как тебя зовут?',1],['me','我叫拉德米尔。','wǒ jiào Lādémǐ\'ěr.','Ты называешь своё имя'],['xm','好！','Hǎo!','Хорошо!']].map(([w,z,p,r,nw])=>`<div class="ln${w==='me'?' me':''}">${w==='me'?'<span class="av me">Р</span>':`<img class="av" src="${IMG}xiaoming.jpg" alt="小明">`}<div class="bb">${nw?'<span class="nw">✨ новое · пока просто пойми</span><br>':''}${w==='xm'?`<button class="zh say" data-w="${z.replace(/[！？。]/g,'')}">${z}</button>`:`<span class="zh">${z}</span>`}${p?`<span class="py">${p}</span>`:''}<small>${r}</small></div></div>`).join('')}</div>
  <div class="tip">🎤 Настоящий разговор с 小明 в микрофон — в <b>домашнем задании</b>. Там он сам поздоровается и спросит, как тебя зовут!</div>
  ${chk('小明 спрашивает: <span class="zh-i">你叫什么名字？</span> Что ты ответишь?',['<span class="zh">我叫拉德米尔。</span>','<span class="zh">你好！</span>','<span class="zh">好！</span>'],0,'Он спросил «Как тебя зовут?» — отвечаем 我叫… и имя.')}`},

 {t:'Финиш',h:()=>{const R=Object.values(ST.res);return `<span class="part"><b style="background:var(--ok)">🏁</b> финиш</span>
  <h2>Радмир, ты догнал группу! 🎉</h2>
  <p class="lead">Теперь ты знаешь всё, что прошли на уроке 5: откуда взялись иероглифы, что такое ключи, как писать ${zh('你 我 好 叫')} и своё имя ${zh('拉德米尔')} и как знакомиться.</p>
  ${R.length?`<h3>Мои результаты</h3><div class="sumr">${R.map(r=>`<div class="n"><span>${r.t}</span><b class="${r.ok>=r.of-1||r.of===30&&r.ok>=24?'g':'y'}">${r.ok} / ${r.of}${r.ok>=r.of-1||r.of===30&&r.ok>=24?' ✓':' · можно повторить для закрепления'}</b></div>`).join('')}</div>`:''}
  <div id="godz"></div>`;},
  on:()=>{send('dg',{done:true,res:ST.res});
   fetch('../dz-5/',{method:'HEAD',cache:'no-store'}).then(r=>r.ok).catch(()=>false).then(ok=>{const g=$('#godz');if(!g)return;
    if(!ok){g.innerHTML='<div class="tip" style="text-align:center">📚 Домашнее задание к уроку 5 скоро появится — учитель пришлёт ссылку.</div>';return;}
    const url='../dz-5/'+(isTest()?'':'?name='+encodeURIComponent('Радмир'));
    g.innerHTML=`<div class="row" style="justify-content:center;margin-top:24px"><a class="btn okb" href="${url}" style="font-size:19px;padding:18px 30px">Домашнее задание к уроку 5 → <span id="cd">через 10 с</span></a></div>
     <p class="lead" style="text-align:center;font-size:15px;color:var(--mu)">Сейчас откроется домашнее задание — его делает вся группа. Там будет много прописей, игры с ключами и разговор с 小明.</p>`;
    let n=10;const t=setInterval(()=>{const c=$('#cd');if(!c){clearInterval(t);return;}n--;c.textContent=n>0?'через '+n+' с':'';if(n<=0){clearInterval(t);location.href=url;}},1000);});}}
];

/* ===================== shell ===================== */
const wordBtns=(list,showSay)=>`<div class="wl">${list.map(([hz,py,say,ru])=>`<button class="n" data-w="${hz}"><span class="zh">${hz}</span><span class="py">${tpy(py)}</span>${showSay&&say?`<span class="snd">звучит: <span class="py" style="font-size:16px">${tpy(say)}</span></span>`:''}<small>${ru} 🔊</small></button>`).join('')}</div>`;
let cur=0;try{cur=Math.min(STEPS.length-1,+localStorage.getItem('zh-dogon5-step')||0);}catch(e){}
function render(){const s=STEPS[cur];try{localStorage.setItem('zh-dogon5-step',cur)}catch(e){}LASTPOS=[];stopAll();stopTM();
 $('#app').innerHTML=`<div class="top n"><span class="zh">补课</span><div><h1>Догоняем урок 5</h1><small>${isTest()?'🧑‍🏫 режим учителя — результаты не сохраняются':'Иероглифы, ключи, 你 我 好 叫, имена, 小明'}</small></div>
   <div class="prog">Шаг ${cur} из ${STEPS.length-1}<div class="bar"><i style="width:${cur/(STEPS.length-1)*100}%"></i></div></div></div>
  <div class="main n">${s.h()}
   <div class="nextbar">${cur?'<button class="btn g" id="pv">‹ Назад</button>':''}${cur<STEPS.length-1?`<button class="btn nx" id="nx">${!cur?'Начать →':cur===STEPS.length-2?'Финиш →':'Дальше: '+STEPS[cur+1].t+' →'}</button>`:''}</div></div>`;
 bind();s.on&&s.on();
 const nx=$('#nx'),pv=$('#pv');nx&&(nx.onclick=()=>{if(!cur&&!ST.name){toast('Сначала выбери, кто занимается 🙂');return;}cur++;render();scrollTo({top:0,behavior:'smooth'});});pv&&(pv.onclick=()=>{cur--;render();scrollTo({top:0,behavior:'smooth'});});}
Promise.race([VOKP,new Promise(r=>setTimeout(r,2500))]).then(()=>{render();flush();preload(['你好','我叫','拉德米尔'].map(urlW));});
</script></body></html>

:root{
  --ink:#0d1020;--ink2:#171b33;--ink3:#232845;--paper:#f3eee5;--card:#fffdf9;--line:#ffffff1c;
  --red:#e8402f;--red2:#ff6b55;--gold:#f4c34f;--jade:#17a37a;--jade2:#3fd3a1;--sky:#7fb2ff;--muted:#9aa0c7;
  --hz:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --disp:Unbounded,Manrope,'LXGW WenKai GB',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060d;overflow:hidden}
body{font-family:Manrope,'LXGW WenKai GB',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hz{font-family:var(--hz);font-weight:700}
.py{color:var(--gold);font-weight:800;letter-spacing:.02em}
.ru{color:#c9cbe0}
body.nopy .py.opt{visibility:hidden}
body.noru .ru.opt{visibility:hidden}


#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;background:radial-gradient(900px 600px at 80% 20%,#1d2752 0%,var(--ink) 60%);overflow:hidden;border-radius:6px}
.slide{position:absolute;inset:0;padding:44px 56px 70px;display:none;flex-direction:column}
.slide.on{display:flex;animation:sIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip-title{position:absolute;top:22px;left:56px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip-title b{background:var(--red);color:#fff;border-radius:8px;padding:4px 9px;letter-spacing:.06em}
.mode{position:absolute;top:20px;right:56px;font-size:13px;font-weight:800;padding:7px 12px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff24;color:#e7e8f5}
h2{font-family:var(--disp);font-weight:900;font-size:40px;letter-spacing:-.03em;margin:34px 0 6px;line-height:1.05}
.sub{color:var(--muted);font-size:17px;margin:0 0 18px;line-height:1.5}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:13px;font-weight:800;font-size:15px;background:#ffffff14;border:1px solid #ffffff24;transition:.15s}
.btn:hover{background:#ffffff24}
.btn.red{background:var(--red);border-color:var(--red)}.btn.red:hover{background:var(--red2)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.jade{background:var(--jade);border-color:var(--jade)}
.play{width:52px;height:52px;border-radius:50%;background:var(--red);display:inline-grid;place-items:center;font-size:18px;flex:none;box-shadow:0 10px 24px -10px #e8402f;transition:.15s}
.play:hover{background:var(--red2);transform:scale(1.05)}
.play.sm{width:38px;height:38px;font-size:13px}
.play.playing{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e8402f99}100%{box-shadow:0 0 0 18px #e8402f00}}
.rv{transition:opacity .3s,filter .3s}
.rv.hid{opacity:0;filter:blur(8px);pointer-events:none}
.hint{position:absolute;bottom:78px;right:56px;font-size:12px;color:#6c7199;letter-spacing:.06em}
kbd{font-family:inherit;font-size:11px;padding:2px 6px;border-radius:5px;background:#ffffff18;border:1px solid #ffffff2a}


#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;display:flex;gap:6px;align-items:center;background:#0d1020e6;border:1px solid #ffffff22;backdrop-filter:blur(10px);padding:6px;border-radius:16px;transition:opacity .4s}
#bar.fade{opacity:.15}#bar:hover{opacity:1}
#bar button{padding:9px 12px;border-radius:11px;font-weight:800;font-size:13px}
#bar button:hover{background:#ffffff18}
#bar button.on{background:#ffffff22}
#bar .n{font-size:13px;font-weight:800;min-width:64px;text-align:center;color:#c9cbe0}
#menu{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:60;width:min(560px,94vw);max-height:70vh;overflow:auto;background:#0d1020f2;border:1px solid #ffffff22;border-radius:18px;padding:10px;display:none}
#menu.open{display:block}
#menu button{display:flex;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700}
#menu button:hover,#menu button.cur{background:#ffffff14}
#vmenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700}#vmenu button:hover,#vmenu button.cur{background:#0d10200d}
#menu button i{font-style:normal;color:var(--muted);min-width:24px}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:80;background:#fff;color:var(--ink);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:800;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}


.cover{justify-content:center}
.cover .big{font-family:var(--hz);font-weight:700;font-size:118px;line-height:1;color:var(--red2);text-shadow:0 20px 60px #e8402f55}
.cover h1{font-family:var(--disp);font-size:64px;font-weight:900;letter-spacing:-.04em;margin:0 0 8px}
.trio{display:flex;gap:16px;margin-top:34px}
.trio div{background:#ffffff0e;border:1px solid #ffffff22;border-radius:20px;padding:16px 22px;min-width:170px}
.trio .hz{font-size:54px;display:block;line-height:1.1}
.cover-photos{position:absolute;right:-70px;top:40px;width:500px;height:640px}
.cover-photos div{position:absolute;width:230px;height:300px;border-radius:22px;background-size:cover;background-position:center;box-shadow:0 30px 60px -20px #000c;border:4px solid #ffffff22}


.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:6px}
.wcard{height:190px;perspective:900px;cursor:pointer}
.wcard .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.wcard.on .in{transform:rotateY(180deg)}
.wcard .f,.wcard .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.wcard .f{background:#ffffff0d;border:1px solid #ffffff22}
.wcard .f .hz{font-size:54px;white-space:nowrap}.wcard .f .hz.l3{font-size:40px}
.wcard .b{background:var(--paper);color:var(--ink);transform:rotateY(180deg)}
.wcard .b .hz{font-size:34px}.wcard .b .py{color:var(--red);font-size:20px}.wcard .b .ru{color:#555;font-size:15px}

.bub .av{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;background:linear-gradient(135deg,#f4c34f,#e8402f)}
.bub.b .av{background:linear-gradient(135deg,#7fb2ff,#3b67c9)}
.bub .tx{background:#fff;border:1px solid #e3dccf;border-radius:20px;padding:10px 18px;box-shadow:0 14px 30px -22px #3b2f1a55;cursor:pointer}
.bub.b .tx{background:#0d1020;color:#fff;border-color:#0d1020}.bub.b .py{color:var(--gold)}.bub.b .ru{color:#c9cbe0}
.bub .tx .hz{font-size:34px;display:block;line-height:1.25}
.bub .tx .py{font-size:16px}.bub .tx .ru{font-size:15px;display:block}
.bub.hidb{opacity:0;transform:translateY(12px);pointer-events:none}

.gap{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
.gap-row{display:grid;grid-template-columns:40px 1fr 300px;gap:14px;align-items:center;background:#fff;border:1px solid #e3dccf;border-radius:14px;padding:6px 14px}
.gap-row .n{font-family:var(--disp);font-weight:900;color:#857f70}
.gap-row .s{font-family:var(--hz);font-weight:700;font-size:30px}
.gap-row .s b{display:inline-block;min-width:52px;text-align:center;border-bottom:3px dashed #c9bda6;color:#d2371f}
.gap-row .ch{display:flex;gap:8px;justify-content:flex-end}
.gap-row .ch button{width:64px;height:46px;border-radius:12px;background:#f1ebdf;font-family:var(--hz);font-weight:700;font-size:26px}
.gap-row .ch button.ok{background:var(--jade);color:#fff}.gap-row .ch button.no{background:#ffd3cb;color:#a3271a}
.gap-row .ru{font-size:13px;display:block}

.bl{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.bl-ru{font-family:var(--disp);font-size:30px;font-weight:700}
.lane{min-height:92px;border-radius:20px;border:2px dashed #cfc5b2;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fffdf8;transition:.2s}
.lane.ok{border-style:solid;border-color:var(--jade);background:#e8f7f0}
.lane.no{animation:shake .4s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:80px}
.chip{padding:10px 16px;border-radius:14px;background:#fff;border:1px solid #e3dccf;box-shadow:0 8px 16px -12px #0005;text-align:center;transition:.15s}
.chip:hover{transform:translateY(-2px)}
.chip .hz{display:block;font-size:34px;line-height:1.1}.chip small{display:block;font-size:12px;color:#d2371f;font-weight:800}
.bl-fb{min-height:28px;font-size:18px;font-weight:800}
.bl-fb.ok{color:var(--jade)}.bl-fb.no{color:#d2371f}

.drow{grid-template-columns:34px 40px 1fr 150px!important;gap:10px!important}
.drow input{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid #e3dccf;font:inherit;font-size:17px;font-weight:700;outline:none;background:#fffdf8;-webkit-user-select:text;user-select:text}
.drow input:focus{border-color:#e8402f}
.drow input.ok{border-color:var(--jade);background:#e8f7f0}.drow input.half{border-color:var(--gold);background:#fff6dc}.drow input.no{border-color:#e8402f;background:#ffefec}

.wr{flex:1;display:grid;grid-template-columns:150px 380px 1fr;gap:22px;min-height:0;align-items:start}
.wr-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wr-list button{height:64px;border-radius:14px;background:#fff;border:1px solid #e3dccf;font-family:var(--hz);font-weight:700;font-size:34px;position:relative}
.wr-list button.sel{background:#0d1020;color:#fff}
.wr-list button.new:after{content:'NEW';position:absolute;top:3px;right:4px;font-family:Manrope;font-size:9px;font-weight:900;color:#e8402f}
.wr-list button.done:before{content:'✓';position:absolute;bottom:2px;right:6px;font-family:Manrope;font-size:13px;color:var(--jade)}
.tzg{position:relative;width:380px;height:380px;background:#fffdf8;border:2px solid #d2371f;border-radius:6px;box-shadow:0 20px 40px -26px #3b2f1a66}
.tzg svg.grid{position:absolute;inset:0;pointer-events:none}
#hw{position:absolute;inset:0}
.wr-mid .row{margin-top:12px}
.wr-info .hz{font-size:60px;line-height:1}
.wr-info .py{font-size:26px}
.wr-free{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.fcell{position:relative;width:150px;height:150px;background:#fffdf8;border:2px solid #d2371f;border-radius:4px}
.fcell .tpl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hz);font-weight:500;font-size:118px;color:#e9dfcc;pointer-events:none;line-height:1}
.fcell.blank .tpl{color:transparent}
.fcell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.fcell svg{position:absolute;inset:0;pointer-events:none}
.wr-msg{min-height:26px;font-weight:800;font-size:16px;margin-top:8px}

.lsx{flex:1;display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center}
.lsx-q{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.lsx-q div{background:#fff;border:1px solid #e3dccf;border-radius:16px;padding:12px 16px;font-size:16px;color:#3a3e57}
.lsx-q b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#857f70;margin-bottom:4px}
.note-y .hz,.qtog .hz{font-size:inherit!important;line-height:inherit!important}
.gap{gap:6px}.gap-row{padding:2px 14px}.gap-row .s{font-size:26px}.gap-row .ch button{height:40px;width:58px;font-size:22px}
.wr-free{display:grid;grid-template-columns:150px 150px;gap:10px}

body.locked #wrap,body.locked #bar{visibility:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#vmenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700}#vmenu button:hover,#vmenu button.cur{background:#0d10200d}
</style>

</div>

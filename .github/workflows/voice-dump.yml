name: Проверка записей (для анализатора тонов)
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    strategy: {matrix: {j: [0, 1, 2, 3]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - run: python tools/voice_dump.py $(( ${{ matrix.j }} * 5 + 0 )) 20
      - run: python tools/voice_dump.py $(( ${{ matrix.j }} * 5 + 1 )) 20
      - run: python tools/voice_dump.py $(( ${{ matrix.j }} * 5 + 2 )) 20
      - run: python tools/voice_dump.py $(( ${{ matrix.j }} * 5 + 3 )) 20
      - run: python tools/voice_dump.py $(( ${{ matrix.j }} * 5 + 4 )) 20

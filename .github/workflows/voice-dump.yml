name: Проверка записей (для анализатора тонов)
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    strategy: {matrix: {half: [0, 5]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - run: python tools/voice_dump.py $(( ${{ matrix.half }} + 0 )) 10
      - run: python tools/voice_dump.py $(( ${{ matrix.half }} + 1 )) 10
      - run: python tools/voice_dump.py $(( ${{ matrix.half }} + 2 )) 10
      - run: python tools/voice_dump.py $(( ${{ matrix.half }} + 3 )) 10
      - run: python tools/voice_dump.py $(( ${{ matrix.half }} + 4 )) 10
